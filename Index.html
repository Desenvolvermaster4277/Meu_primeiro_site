padding:0;

color:#fff;
min-height:100vh;
}

button,input{

}

button{
cursor:pointer;
border:0;
}

.hidden{
display:none!important;
}

#loginScreen{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.loginBox{
width:100%;
max-width:420px;
background:rgba(25,5,40,.95);
border:1px solid #68219b;
border-radius:24px;
padding:30px;
box-shadow:0 0 40px rgba(120,30,180,.25);
}

.logo{
font-size:32px;
font-weight:900;
text-align:center;
margin-bottom:8px;
color:#c66aff;
}

.subtitle{
text-align:center;
color:#aaa;
margin-bottom:25px;
}

.tabs{
display:flex;
gap:8px;
margin-bottom:20px;
}

.tab{
flex:1;
padding:12px;
border-radius:12px;
background:#21102d;
color:#aaa;
}

.tab.active{
background:#7b24b5;
color:white;
}

input{
width:100%;
padding:14px;
margin-bottom:12px;
border-radius:12px;
border:1px solid #4c2465;
background:#100718;
color:white;
outline:none;
}

input:focus{
border-color:#a83de7;
}

.primary{
width:100%;
padding:14px;
border-radius:12px;
background:linear-gradient(135deg,#8e2bd1,#5c158d);
color:white;
font-weight:bold;
margin-top:5px;
}

.primary:active{
transform:scale(.98);
}

#app{
display:none;
min-height:100vh;
}

.topbar{
position:sticky;
top:0;
z-index:20;
height:65px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
background:rgba(12,2,20,.96);
border-bottom:1px solid #351346;
backdrop-filter:blur(10px);

.brand{
font-size:20px;
font-weight:bold;
color:#d17aff;

.topActions{
display:flex;
gap:8px;
}

.iconBtn{
width:42px;
height:42px;
border-radius:12px;
background:#21102d;
color:white;
font-size:18px;
position:relative;
}

.badge{
position:absolute;
top:-4px;
right:-4px;
background:#ff285d;
color:#fff;
font-size:10px;
min-width:18px;
height:18px;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;

.container{
width:100%;
max-width:1100px;
margin:auto;
padding:20px 15px 90px;

.hero{

border-radius:22px;
padding:24px;
margin-bottom:18px;
}

.hero h1{
font-size:28px;
margin-bottom:8px;
}

.hero p{
color:#bda9c7;
line-height:1.5;
}

.sectionTitle{
font-size:20px;
margin:22px 0 12px;
}

.cards{

grid-template-columns:repeat(auto-fit,minmax(240px,1fr));

.card{
background:#160a20;
border:1px solid #392044;
border-radius:20px;
padding:18px;

}

.card:hover{
border-color:#8530b5;
transform:translateY(-2px);

.gameIcon{
height:130px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:52px;
background:linear-gradient(135deg,#42105f,#17031f);

.card h3{
margin-bottom:7px;
}

.card p{
color:#9f91a8;
font-size:14px;
line-height:1.4;
margin-bottom:15px;
}

padding:11px 14px;
border-radius:11px;
background:#281333;
color:#fff;
font-weight:bold;
}

.btn.primaryBtn{
background:#8127b7;
}

.btn.green{
background:#159447;
}

.btn.red{
background:#a52242;
}

.btn.blue{
background:#225fa8;
}

.btn:active{

}

align-items:center;
gap:15px;
background:#160a20;
border:1px solid #392044;
border-radius:20px;
padding:18px;
margin-bottom:15px;
}

height:75px;
border-radius:50%;
object-fit:cover;
background:#321441;
border:2px solid #9130c9;

align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold;

.profileName{
font-size:22px;
font-weight:bold;
}

.profileMeta{
color:#9e91a7;
margin-top:4px;
}

gap:10px;
margin-bottom:15px;
}

.stat{
background:#160a20;
border:1px solid #392044;
border-radius:16px;
padding:15px;
}

.stat b{
display:block;
font-size:21px;
color:#d27aff;
margin-bottom:4px;
}

.stat span{
font-size:12px;
color:#98889f;
}

.row{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.panel{
background:#160a20;
border:1px solid #392044;
border-radius:20px;
padding:18px;
margin-bottom:15px;
}

.avatarSmall{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
background:#321441;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
flex-shrink:0;
}

.userRow{
display:flex;
align-items:center;
gap:12px;
padding:12px 0;
border-bottom:1px solid #2d1937;
}

.userRow:last-child{
border-bottom:0;
}

.userInfo{
flex:1;
min-width:0;
}

.userInfo b{
display:block;
}

.userInfo span{
font-size:12px;
color:#96889c;
}

.online{
color:#43dc72!important;
}

.offline{
color:#817783!important;
}

.notice{
padding:12px;
border-radius:12px;
background:#24112e;
color:#bda9c7;
margin-bottom:8px;
font-size:13px;
}

.notificationUnread{
border-left:3px solid #b43fe9;
}

.chatBox{
height:55vh;
display:flex;
flex-direction:column;
}

.messages{
flex:1;
overflow-y:auto;
padding:10px 0;
}

.message{
max-width:80%;
padding:10px 12px;
border-radius:14px;
margin-bottom:8px;
line-height:1.4;
word-break:break-word;
}

.message.mine{
margin-left:auto;
background:#7021a0;
border-bottom-right-radius:4px;
}

.message.theirs{
background:#2a1832;
border-bottom-left-radius:4px;
}

.messageTime{
font-size:9px;
opacity:.6;
margin-top:4px;
}

.chatInput{
display:flex;
gap:8px;
margin-top:10px;
}

.chatInput input{
margin:0;
}

.gameScreen{
max-width:800px;
margin:auto;
}

.gameTop{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:15px;
}

.gameTitle{
font-size:22px;
font-weight:bold;
}

.progress{
height:8px;
background:#28152f;
border-radius:20px;
overflow:hidden;
margin-bottom:15px;
}

.progress div{
height:100%;
background:linear-gradient(90deg,#8d2bc4,#d56cff);
transition:.2s;
}

.questionCard{
background:#160a20;
border:1px solid #4c2362;
border-radius:22px;
padding:22px;
}

.questionNumber{
color:#a991af;
font-size:13px;
margin-bottom:10px;
}

.question{
font-size:21px;
font-weight:bold;
line-height:1.4;
margin-bottom:20px;
}

.answers{

grid-template-columns:1fr;
gap:10px;

color:white;
border:1px solid #442451;
border-radius:13px;
text-align:left;
}

.answer:hover{
border-color:#a43bd8;
}

.answer.correct{
background:#145b34;
border-color:#39d47a;

.answer.wrong{
background:#672038;
border-color:#ff466e;
}

.timer{
font-size:22px;
font-weight:bold;
color:#e277ff;
}

gap:8px;
margin-top:12px;

padding:11px 5px;
border-radius:11px;

font-size:12px;

.life:disabled{

grid-template-columns:repeat(5,1fr);
gap:5px;

padding:6px 2px;
text-align:center;

color:#9e91a6;

.prize .current{

right:0;

justify-content:space-around;
align-items:center;
z-index:30;

.navBtn{
background:none;
color:#8f8097;
font-size:11px;
display:flex;
flex-direction:column;
align-items:center;
gap:3px;

.navBtn.active{
color:#d06aff;

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.72);
display:flex;
align-items:center;
justify-content:center;
padding:15px;
z-index:100;
}

.modalBox{
width:100%;
max-width:500px;
max-height:90vh;
overflow-y:auto;
background:#170920;
border:1px solid #68238e;
border-radius:22px;
padding:20px;
}

.modalHead{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.close{
background:#2a1533;
color:#fff;
width:35px;
height:35px;
border-radius:10px;
}

.hiddenFile{
display:none;
}

.photoBtn{
display:inline-block;
padding:10px 13px;
border-radius:10px;
background:#2b1537;
cursor:pointer;
font-size:13px;
}

.toast{
position:fixed;
left:50%;
bottom:80px;
transform:translateX(-50%);
background:#24102d;
border:1px solid #7930a1;
padding:12px 16px;
border-radius:12px;
z-index:200;
display:none;
max-width:90%;
text-align:center;
}

.empty{
text-align:center;
padding:25px 10px;
color:#887a90;
}

.rankNumber{
width:30px;
font-weight:bold;
color:#d06aff;
}

.rankScore{
font-weight:bold;
margin-left:auto;
color:#d06aff;
}

.challenge{
background:linear-gradient(135deg,#26103a,#180721);
border:1px solid #6c2690;
}

@media(min-width:700px){
.stats{
grid-template-columns:repeat(4,1fr);
}
.answers{
grid-template-columns:1fr 1fr;
}
}

</style>
</head>

</div>

function escapar(texto){

return String(texto||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function traduzirErro(error){

const code=error?.code||"";

const erros={
"auth/email-already-in-use":"Este e-mail já está cadastrado.",
"auth/invalid-email":"E-mail inválido.",
"auth/user-not-found":"Usuário não encontrado.",
"auth/wrong-password":"Senha incorreta.",
"auth/invalid-credential":"E-mail ou senha incorretos.",
"auth/weak-password":"A senha é muito fraca.",
"auth/too-many-requests":"Muitas tentativas. Aguarde um pouco.",
"auth/network-request-failed":"Falha de conexão com a internet."
};

return erros[code]||error?.message||"Ocorreu um erro.";

}

async function carregarPerfil(){

if(!usuario)return;

const ref=db.collection("Usuarios").doc(usuario.uid);

const snap=await ref.get();

if(snap.exists){

perfil=snap.data();

}else{

perfil={
nome:usuario.email?.split("@")[0]||"Jogador",
nomeBusca:(usuario.email||"jogador").toLowerCase(),
email:usuario.email||"",
avatar:"",
xp:0,
nivel:1,
moedas:0,
recorde:0,
maiorPremio:0,
partidas:0,
vitorias:0,
acertos:0,
erros:0,
titulo:"Novato"
};

await ref.set(perfil);

}

}

}

return `<div class="avatarSmall">${escapar(getNome().charAt(0).toUpperCase())}</div>`;

}

async function salvarPerfil(){

if(!usuario||!perfil)return;

perfil.nomeBusca=(perfil.nome||"").toLowerCase();

await db.collection("Usuarios")
.doc(usuario.uid)
.set(perfil,{merge:true});

await salvarRanking();

}


async function salvarRanking(){

if(!usuario||!perfil)return;

try{

await db.collection("Partidas")
.doc("ranking_"+usuario.uid)
.set({

tipo:"ranking",
uid:usuario.uid,
nome:getNome(),
nomeBusca:(getNome()||"").toLowerCase(),
avatar:perfil.avatar||"",
recorde:perfil.recorde||0,
maiorPremio:perfil.maiorPremio||0,
nivel:perfil.nivel||1,
xp:perfil.xp||0,
atualizadoEm:FV.serverTimestamp()

},{merge:true});

}catch(e){

console.log("Ranking:",e);

}

}

function embaralhar(array){

const arr=[...array];

for(let i=arr.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[arr[i],arr[j]]=[arr[j],arr[i]];

}

return arr;

}


function prepararQuestoes(categoria){

const banco=bancos[categoria]||bancos.geral;

const escolhidas=embaralhar(banco).slice(0,15);

return escolhidas.map(q=>{

return {
pergunta:q[0],
resposta:q[1],
opcoes:embaralhar(q[2])
};

});

}

}

},1000);

}

function trocarFoto(event){

const file=event.target.files?.[0];

if(!file)return;

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=async()=>{

const canvas=document.createElement("canvas");

canvas.width=256;
canvas.height=256;

const ctx=canvas.getContext("2d");

const menor=Math.min(img.width,img.height);

const sx=(img.width-menor)/2;
const sy=(img.height-menor)/2;

ctx.drawImage(
img,
sx,
sy,
menor,
menor,
0,
0,
256,
256
);

perfil.avatar=canvas.toDataURL("image/jpeg",.7);

await salvarPerfil();

mostrarToast("Foto atualizada!");

abrirPerfil();

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

}

function iniciarMusica(tipo){

if(!musicaLigada)return;

try{

if(!audioCtx){

audioCtx=new(window.AudioContext||window.webkitAudioContext)();

}

if(audioCtx.state==="suspended")audioCtx.resume();

clearInterval(musicTimer);

let freq=tipo==="game"?220:tipo==="final"?330:tipo==="menu"?180:200;

musicTimer=setInterval(()=>{

if(!musicaLigada)return;

const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();

osc.frequency.value=freq;

gain.gain.value=.025;

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start();

osc.stop(audioCtx.currentTime+.18);

freq=freq===220?277:freq===277?330:freq===330?247:220;

},500);

}catch(e){

console.log(e);

}

}


function tocarSom(tipo){

if(!efeitosLigados)return;

try{

if(!audioCtx){

audioCtx=new(window.AudioContext||window.webkitAudioContext)();

}

const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();

let freq=tipo==="correct"?700:
tipo==="wrong"?180:
tipo==="click"?450:300;

osc.frequency.value=freq;

gain.gain.value=.06;

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start();

osc.stop(audioCtx.currentTime+.12);

}catch(e){}

}


function alternarMusica(){

musicaLigada=!musicaLigada;

if(!musicaLigada){

clearInterval(musicTimer);

}else{

iniciarMusica(telaAtual==="game"?"game":"central");

}

abrirPerfil();

}

async function verificarPresenca(uid){

            .doc("presenca_"+uid)
            .get();

        const d=snap.data();

        if(!d.online)return false;

        const tempo=d.ultimaAtividade?.toMillis?.()||0;

        if(!tempo)return false;

        return Date.now()-tempo<120000;

    }catch(e){

        return false;

    }

/* Substitui o finalizador para registrar também a partida */

const finalizarJogoOriginal=finalizarJogo;

finalizarJogo=async function(){

    clearInterval(jogo.timer);

    iniciarMusica("final");


    const venceu=
        jogo.indice>=15 &&
        jogo.acertos===15;


    if(!perfil)perfil={};


    perfil.partidas=
        (perfil.partidas||0)+1;


    perfil.acertos=
        (perfil.acertos||0)+jogo.acertos;


    perfil.erros=
        (perfil.erros||0)+jogo.erros;


    if(
        jogo.premioAtual>
        (perfil.maiorPremio||0)
    ){

        perfil.maiorPremio=
            jogo.premioAtual;

    }


    if(
        jogo.premioAtual>
        (perfil.recorde||0)
    ){

        perfil.recorde=
            jogo.premioAtual;

    }


    let xpGanho=
        jogo.acertos*100;


    if(venceu){

        perfil.vitorias=
            (perfil.vitorias||0)+1;

        xpGanho+=1000;

    }


    perfil.xp=
        (perfil.xp||0)+xpGanho;


    perfil.nivel=
        Math.max(
            1,
            Math.floor(
                (perfil.xp||0)/1000
            )+1
        );


    perfil.moedas=
        (perfil.moedas||0)+
        jogo.acertos*10;


    await salvarPerfil();

    await registrarPartida();


    const premio=
        jogo.premioAtual;


    document.getElementById("central").innerHTML=`

        <div class="questionCard endBox">

            <div style="font-size:55px">
                ${venceu?"🏆":"🎮"}
