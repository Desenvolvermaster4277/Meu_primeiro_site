<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optimus Prime AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080b12;
    color:#fff;
    min-height:100vh;
}

header{
    padding:18px;
    background:#101722;
    border-bottom:1px solid #263244;
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

header h1{
    margin:0;
    font-size:20px;
}

header p{
    margin:3px 0 0;
    color:#94a3b8;
    font-size:13px;
}

.chat{
    max-width:850px;
    margin:auto;
    padding:20px;
    padding-bottom:120px;
}

.welcome{
    text-align:center;
    margin:50px 0 35px;
}

.welcome h2{
    font-size:32px;
    margin-bottom:10px;
}

.welcome p{
    color:#94a3b8;
}

.message{
    display:flex;
    margin:18px 0;
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:80%;
    padding:14px 17px;
    border-radius:18px;
    line-height:1.5;
    white-space:pre-wrap;
}

.ai .bubble{
    background:#151c28;
    border:1px solid #263244;
}

.user .bubble{
    background:#2563eb;
}

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#080b12;
    border-top:1px solid #263244;
    padding:15px;
}

.input-box{
    max-width:850px;
    margin:auto;
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:15px;
    border-radius:14px;
    border:1px solid #334155;
    background:#111827;
    color:white;
    outline:none;
    font-size:16px;
}

button{
    border:0;
    border-radius:14px;
    padding:0 20px;
    background:#2563eb;
    color:white;
    font-size:20px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    max-width:600px;
    margin:auto;
}

.card{
    padding:15px;
    background:#111827;
    border:1px solid #263244;
    border-radius:14px;
    cursor:pointer;
}

.card:hover{
    border-color:#3b82f6;
}

@media(max-width:600px){
    .bubble{max-width:90%}
    .welcome h2{font-size:27px}
}
</style>
</head>

<body>

<header>
    <div class="logo">🤖</div>
    <div>
        <h1>Optimus Prime</h1>
        <p>Assistente virtual inteligente</p>
    </div>
</header>

<main class="chat" id="chat">

    <div class="welcome" id="welcome">
        <h2>Olá, eu sou a Optimus Prime 🤖</h2>
        <p>Como posso ajudar você hoje?</p>

        <div class="cards">
            <div class="card" onclick="suggest('Explique o que é inteligência artificial')">
                🧠 Inteligência Artificial
            </div>

            <div class="card" onclick="suggest('Me ajude a criar um site')">
                💻 Criar um site
            </div>

            <div class="card" onclick="suggest('Faça uma análise de dados')">
                📊 Analisar dados
            </div>

            <div class="card" onclick="suggest('Me dê uma ideia de negócio')">
                💡 Ideias
            </div>
        </div>
    </div>

</main>

<div class="input-area">
    <div class="input-box">
        <input
            id="input"
            type="text"
            placeholder="Pergunte alguma coisa..."
            onkeydown="if(event.key==='Enter') sendMessage()"
        >

        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");

function suggest(text){
    input.value = text;
    sendMessage();
}

function addMessage(text,type){

    const message = document.createElement("div");

    message.className = "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);

    chat.appendChild(message);

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });
}

function sendMessage(){

    const text = input.value.trim();

    if(!text) return;

    const welcome = document.getElementById("welcome");

    if(welcome) welcome.remove();

    addMessage(text,"user");

    input.value="";

    setTimeout(()=>{

        const answer = generateAnswer(text);

        addMessage(answer,"ai");

    },500);
}

function generateAnswer(text){

    const t = text.toLowerCase();

    if(
        t.includes("olá") ||
        t.includes("ola") ||
        t.includes("oi") ||
        t.includes("bom dia") ||
        t.includes("boa tarde") ||
        t.includes("boa noite")
    ){

        return "Olá! 👋 Eu sou a Optimus Prime. Estou pronta para conversar, explicar assuntos, ajudar com ideias, programação e análises.";
    }

    if(t.includes("inteligência artificial") || t.includes("ia")){

        return "Inteligência Artificial é uma área da tecnologia que permite que computadores realizem tarefas que normalmente exigiriam inteligência humana, como interpretar textos, reconhecer padrões, analisar informações e gerar respostas.";
    }

    if(t.includes("site") || t.includes("website")){

        return "Posso ajudar você a criar sites. 💻\n\nPodemos trabalhar com HTML, CSS e JavaScript e transformar uma ideia em uma página completa.";
    }

    if(
        t.includes("analisar dados") ||
        t.includes("dados") ||
        t.includes("análise")
    ){

        return "Claro! 📊\n\nPara uma análise real, envie os dados que deseja analisar. Posso ajudar a identificar padrões, calcular indicadores, comparar valores e interpretar os resultados.";
    }

    if(t.includes("negócio") || t.includes("negocio")){

        return "Uma boa ideia de negócio começa identificando um problema real. 💡\n\nProcure algo que as pessoas precisam, descubra quanto pagariam por uma solução e depois teste a ideia com poucos clientes antes de investir muito dinheiro.";
    }

    if(t.includes("quem é você") || t.includes("quem é voce")){

        return "Eu sou a Optimus Prime 🤖, uma assistente virtual criada neste site. Esta versão funciona localmente no navegador.";
    }

    if(t.includes("obrigado") || t.includes("obrigada")){

        return "De nada! 😄 Estou aqui para ajudar.";
    }

    if(
        t.includes("html") ||
        t.includes("javascript") ||
        t.includes("css") ||
        t.includes("programar") ||
        t.includes("código") ||
        t.includes("codigo")
    ){

        return "Posso ajudar com programação. 👨‍💻\n\nPosso explicar conceitos, corrigir códigos e ajudar você a construir projetos usando HTML, CSS e JavaScript.";
    }

    if(t.includes("matemática") || t.includes("matematica")){

        return "Posso ajudar com matemática. 🔢\n\nDigite a conta ou o problema que deseja resolver.";
    }

    return "Entendi sua pergunta. 🤖\n\nNesta versão inicial da Optimus Prime, minhas respostas são baseadas em regras programadas no próprio site.\n\nPara eu realmente conversar sobre praticamente qualquer assunto, analisar arquivos e gerar respostas como uma IA avançada, precisamos conectar este site a uma API de inteligência artificial.";
}

</script>

</body>
</html>
