function iniciarAudio(){
 if(audioCtx)return;
 try{
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
 }catch(e){}
}

function som(freq,dur=.15){
 if(!efeitosLigados)return;
 iniciarAudio();
 if(!audioCtx)return;

 const o=audioCtx.createOscillator();
 const g=audioCtx.createGain();

 o.frequency.value=freq;
 o.type="triangle";
 g.gain.setValueAtTime(.035,audioCtx.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);

 o.connect(g);
 g.connect(audioCtx.destination);
 o.start();
 o.stop(audioCtx.currentTime+dur);
}

function tocarMusica(){
 if(!musicaLigada)return;
 iniciarAudio();
 if(!audioCtx)return;

 const notas=[196,247,294,392,294,247,220,294];
 let i=0;

 clearInterval(window.musicLoop);

 window.musicLoop=setInterval(()=>{
  if(!musicaLigada)return;
  somMusical(notas[i%notas.length]);
  i++;
 },420);
}

function somMusical(freq){
 if(!audioCtx)return;

 const o=audioCtx.createOscillator();
 const g=audioCtx.createGain();

 o.type="sine";
 o.frequency.value=freq;

 g.gain.setValueAtTime(.018,audioCtx.currentTime);
 g.gain.exponentialRampToValueAtTime(
  .001,audioCtx.currentTime+.38
 );

 o.connect(g);
 g.connect(audioCtx.destination);
 o.start();
 o.stop(audioCtx.currentTime+.38);
}

function iniciarMusica(){
 if(musicaLigada)tocarMusica();
}

function alternarMusica(){
 musicaLigada=!musicaLigada;

 if(!musicaLigada){
  clearInterval(window.musicLoop);
 }else{
  tocarMusica();
 }

 toast(musicaLigada?"🎵 Música ligada":"🔇 Música desligada");
}

  <h3>👥 Jogar com amigo</h3>
  <button class="btn green full" onclick="modoAmigo()">Jogar no mesmo aparelho</button>

  <h3>🌐 Online</h3>
  <button class="btn gold full" onclick="criarSala()">Criar partida online</button>
 </div>
 `;
}

function embaralhar(a){
 return a.sort(()=>Math.random()-.5);
}

function prepararPerguntas(cat){
 let banco=[...(perguntas[cat]||perguntas.geral)];

 while(banco.length<15){
  banco.push(...(perguntas.geral||[]));
 }

 return embaralhar(banco).slice(0,15);
}

function iniciarMilhao(){
 const cat=document.getElementById("categoria")?.value||"geral";

 jogo={
  categoria:cat,
  perguntas:prepararPerguntas(cat),
  indice:0,
  premio:0,
  acertos:0,
  respondida:false,
  usadas:[],
  pular:1,
  dica:1,
  cinquenta:1
 };

 mostrarPergunta();
 tocarMusica();
}

function mostrarPergunta(){
 clearInterval(timer);

 if(jogo.indice>=15){
  finalizarJogo(true);
  return;
 }

 jogo.respondida=false;

 const p=jogo.perguntas[jogo.indice];
 const correta=p[1];
 const opcoes=embaralhar([correta,...p[2]]);

 perguntaAtual={correta,opcoes};

 conteudo.innerHTML=`
 <div class="card">

  <div class="prize">${dinheiro(premios[jogo.indice])}</div>

  <div class="small center">
   Pergunta ${jogo.indice+1} de 15
  </div>

  <div class="timer"><div id="timerBar"></div></div>

  <div class="question">${esc(p[0])}</div>

  <div class="answers">
   ${opcoes.map((x,i)=>
    `<button class="answer" id="a${i}"
     onclick="responder(${i})">
     ${String.fromCharCode(65+i)}) ${esc(x)}
    </button>`
   ).join("")}
  </div>

  <hr>

  <div class="grid">
   <button class="btn gold" onclick="usar5050()">50/50</button>
   <button class="btn gray" onclick="pular()">Pular</button>
   <button class="btn gray" onclick="dica()">💡 Dica</button>
  </div>

  <p class="center small">
   Acertos: ${jogo.acertos}
  </p>

 </div>
 `;

 let segundos=15;

 timer=setInterval(()=>{
  segundos--;

  const bar=document.getElementById("timerBar");
  if(bar)bar.style.width=(segundos/15*100)+"%";

  if(segundos<=0){
   clearInterval(timer);
   responder(-1);
  }
 },1000);
}

function responder(i){
 if(jogo.respondida)return;
 jogo.respondida=true;
 clearInterval(timer);

 const correta=perguntaAtual.correta;
 const escolhido=i>=0?perguntaAtual.opcoes[i]:null;

 if(i>=0){
  const b=document.getElementById("a"+i);
  if(b)b.classList.add(escolhido===correta?"correct":"wrong");
 }

 if(escolhido!==correta){
  perguntaAtual.opcoes.forEach((x,n)=>{
   if(x===correta){
    document.getElementById("a"+n)?.classList.add("correct");
   }
  });

  jogo.erros=(jogo.erros||0)+1;
  som(130,.25);

  toast(i<0?"⏰ Tempo esgotado!":"❌ Resposta errada!");

  setTimeout(()=>finalizarJogo(false),1300);
  return;
 }

 /* SÓ AQUI o jogador recebe ponto/prêmio */
 jogo.acertos++;
 jogo.premio=premios[jogo.indice];

 som(600,.18);
 setTimeout(()=>som(800,.18),100);

 toast("✅ Resposta correta!");

 setTimeout(()=>{
  jogo.indice++;
  mostrarPergunta();
 },1000);
}

function usar5050(){
 if(!jogo.cinquenta||jogo.respondida)return;
 jogo.cinquenta=0;

 const erradas=perguntaAtual.opcoes
  .map((x,i)=>x!==perguntaAtual.correta?i:null)
  .filter(x=>x!==null);

 embaralhar(erradas).slice(0,2).forEach(i=>{
  const b=document.getElementById("a"+i);
  if(b){
   b.disabled=true;
   b.style.opacity=".2";
  }
 });
}

function pular(){
 if(!jogo.pular||jogo.respondida)return;
 jogo.pular=0;
 clearInterval(timer);
 jogo.indice++;
 mostrarPergunta();
}

function dica(){
 if(!jogo.dica||jogo.respondida)return;
 jogo.dica=0;
 toast("💡 Dica: pense na alternativa que melhor corresponde ao enunciado.");
}

async function finalizarJogo(vitoria){
 clearInterval(timer);

 const premioFinal=vitoria?1000000:jogo.premio;

 if(vitoria){
  jogo.premio=1000000;
 }

 const acertos=jogo.acertos;

 perfil.partidas=(perfil.partidas||0)+1;
 perfil.acertos=(perfil.acertos||0)+acertos;
 perfil.erros=(perfil.erros||0)+(15-acertos);

 /* NÃO soma prêmio em resposta errada */
 if(vitoria){
  perfil.vitorias=(perfil.vitorias||0)+1;
  perfil.maiorPremio=Math.max(
   perfil.maiorPremio||0,
   1000000
  );
 }

 /* Recorde somente baseado em prêmio realmente conquistado */
 if(premioFinal>(perfil.recorde||0)){
  perfil.recorde=premioFinal;
 }

 perfil.xp=(perfil.xp||0)+(acertos*100);

 perfil.nivel=Math.floor((perfil.xp||0)/1000)+1;

 perfil.moedas=(perfil.moedas||0)+acertos*10;

 await salvarPerfil();

 conteudo.innerHTML=`
 <div class="card center">

  <div style="font-size:70px">
   ${vitoria?"🏆":"🎮"}
  </div>

  <div class="title">
   ${vitoria?"VOCÊ VENCEU!":"Fim da partida"}
  </div>

  <p>${vitoria?
   "Parabéns! Você chegou ao milhão!":
   "Você respondeu uma pergunta incorretamente."
  }</p>

  <div class="prize">${dinheiro(premioFinal)}</div>

  <div class="stats">
   <div class="stat"><b>${acertos}</b>Acertos</div>
   <div class="stat"><b>${15-acertos}</b>Erros</div>
   <div class="stat"><b>${perfil.xp}</b>XP</div>
  </div>

  <hr>

  <button class="btn full" onclick="menuMilhao()">Jogar novamente</button>
  <button class="btn gray full" onclick="central()">Voltar</button>

 </div>
 `;

 iniciarMusica();
}

 if(!file)return;

 const reader=new FileReader();

 reader.onload=e=>{
  const img=new Image();

  img.onload=()=>{
   const canvas=document.createElement("canvas");
   canvas.width=256;
   canvas.height=256;

   const c=canvas.getContext("2d");

   const escala=Math.max(
    256/img.width,
    256/img.height
   );

   const w=img.width*escala;
   const h=img.height*escala;

   c.drawImage(
    img,
    (256-w)/2,
    (256-h)/2,
    w,h
   );

   perfil.avatar=canvas.toDataURL(
    "image/jpeg",.7
   );

   salvarPerfil().then(()=>{
    document.getElementById("topUser").innerHTML=
     avatarHtml(perfil,"40px");

    toast("Foto atualizada!");
    abrirPerfil();
   });
  };

  img.src=e.target.result;
 };

 reader.readAsDataURL(file);
}

function iniciarCorrida(){
 let progresso=0;
 let moedas=0;

 conteudo.innerHTML=`
 <div class="card center">
  <h2>🏎️ Corrida do Milhão</h2>
  <div style="font-size:70px">🚗</div>
  <div class="timer">
   <div id="corridaBar"></div>
  </div>
  <p>Toque rapidamente para acelerar!</p>
  <button class="btn green"
   style="font-size:25px;width:100%"
   onclick="acelerar()">
   🚀 ACELERAR
  </button>
  <h2 id="corridaValor">0%</h2>
 </div>
 `;

 window.corridaDados={
  progresso:0,
  moedas:0,
  inicio:Date.now()
 };
}

function acelerar(){
 if(!window.corridaDados)return;

 window.corridaDados.progresso+=
  Math.floor(Math.random()*8)+3;

 window.corridaDados.moedas+=
  Math.floor(Math.random()*5)+1;

 const p=Math.min(
  100,
  window.corridaDados.progresso
 );

 corridaBar.style.width=p+"%";
 corridaValor.textContent=p+"%";

 som(400+p*3,.08);

 if(p>=100){
  finalizarCorrida();
 }
}

async function finalizarCorrida(){
 const moedas=window.corridaDados.moedas;

 perfil.moedas=(perfil.moedas||0)+moedas;
 perfil.xp=(perfil.xp||0)+200;

 await salvarPerfil();

 conteudo.innerHTML=`
 <div class="card center">
  <div style="font-size:70px">🏆</div>
  <h1>Você terminou!</h1>
  <p>Moedas ganhas</p>
  <div class="prize">🪙 ${moedas}</div>
  <button class="btn full" onclick="central()">Continuar</button>
 </div>
 `;

 window.corridaDados=null;
}

/* ================= SALA ONLINE ================= */

async function criarSala(){
 if(!usuario)return;

 const codigo=Math.random()
  .toString(36)
  .substring(2,7)
  .toUpperCase();

 await db.collection("Partidas")
  .doc("sala_"+codigo)
  .set({
   tipo:"sala",
   codigo,
   criador:usuario.uid,
   jogadores:[{
    uid:usuario.uid,
    nome:getNome()
   }],
   status:"aguardando",
   criadoEm:FV.serverTimestamp()
  });

 conteudo.innerHTML=`
 <div class="card center">

  <div style="font-size:60px">🌐</div>

  <h2>Sala criada!</h2>

  <p>Envie este código para seu amigo:</p>

  <div class="prize">${codigo}</div>

  <button class="btn green full"
   onclick="navigator.share?
   navigator.share({text:'Entre na minha partida: '+codigo}):
   navigator.clipboard.writeText('${codigo}')">
   📤 Compartilhar código
  </button>

  <hr>

  <input id="entrarCodigo"
   placeholder="Ou digite código de outra sala">

  <button class="btn full"
   onclick="entrarSala()">
   Entrar em uma sala
  </button>

  <p class="small">
   Quando o amigo entrar, a partida poderá ser iniciada.
  </p>

 </div>
 `;

 ouvirSala(codigo);
}

async function entrarSala(){
 const codigo=document.getElementById("entrarCodigo")
  ?.value.trim().toUpperCase();

 if(!codigo)return toast("Digite o código.");

 const ref=db.collection("Partidas")
  .doc("sala_"+codigo);

 const snap=await ref.get();

 if(!snap.exists)return toast("Sala não encontrada.");

 const sala=snap.data();

 if((sala.jogadores||[]).some(x=>x.uid===usuario.uid))
  return toast("Você já está nessa sala.");

 if((sala.jogadores||[]).length>=3)
  return toast("Sala cheia.");

 await ref.update({
  jogadores:FV.arrayUnion({
   uid:usuario.uid,
   nome:getNome()
  })
 });

 toast("Você entrou na sala!");

 ouvirSala(codigo);
}

function ouvirSala(codigo){
 const ref=db.collection("Partidas")
  .doc("sala_"+codigo);

 if(window.salaUnsub)window.salaUnsub();

 window.salaUnsub=ref.onSnapshot(snap=>{
  if(!snap.exists)return;

  const sala=snap.data();

  conteudo.innerHTML=`
   <div class="card center">

    <h2>🌐 Sala ${codigo}</h2>

    <h3>Jogadores</h3>

    ${(sala.jogadores||[]).map(x=>
     `<div class="friendrow">
      <div class="rowinfo">
       <b>${esc(x.nome)}</b>
      </div>
     </div>`
    ).join("")}

    ${sala.criador===usuario.uid?
     `<button class="btn green full"
      onclick="iniciarSala('${codigo}')">
      🎮 Iniciar partida
     </button>`:
     `<p>Esperando o criador iniciar...</p>`
    }

   </div>
  `;
 });
}

async function iniciarSala(codigo){
 await db.collection("Partidas")
  .doc("sala_"+codigo)
  .update({
   status:"iniciada",
   iniciadaEm:FV.serverTimestamp()
  });

 iniciarMilhao();
}
