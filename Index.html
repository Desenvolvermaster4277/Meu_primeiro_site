</div>

for(let i=0;i<500;i++){
    const a=Math.floor(Math.random()*1000);
    const b=Math.floor(Math.random()*1000);
    const op=i%3;

    if(op===0){
        perguntas.matematica=perguntas.matematica||[];
        perguntas.matematica.push([
            `Quanto é ${a} + ${b}?`,
            [String(a+b),String(a+b+1),String(a+b-1),String(a+b+10)],
            0
        ]);
    }else if(op===1){
        const maior=Math.max(a,b);
        const menor=Math.min(a,b);
        perguntas.matematica=perguntas.matematica||[];
        perguntas.matematica.push([
            `Quanto é ${maior} - ${menor}?`,
            [String(maior-menor),String(maior-menor+2),String(maior-menor+5),String(maior-menor+10)],
            0
        ]);
    }else{
        perguntas.matematica=perguntas.matematica||[];
        perguntas.matematica.push([
            `Quanto é ${a} × ${b}?`,
            [String(a*b),String(a*b+1),String(a*b-1),String(a*b+10)],
            0
        ]);
    }
}

async function login(){
    const email=$("loginEmail").value.trim();
    const senha=$("loginPassword").value;

    if(!email||!senha){
        mostrarToast("Preencha todos os campos.");
        return;
    }

    try{
        await auth.signInWithEmailAndPassword(email,senha);
        mostrarToast("Entrando...");
    }catch(e){
        mostrarToast(traduzirErro(e));
    }
}

async function cadastro(){
    try{
        const nome=$("signupName").value.trim();
        const email=$("signupEmail").value.trim();
        const senha=$("signupPassword").value;

        if(!nome||!email||!senha){
            mostrarToast("Preencha todos os campos.");
            return;
        }

        if(senha.length<6){
            mostrarToast("A senha precisa ter pelo menos 6 caracteres.");
            return;
        }

        const cred=await auth.createUserWithEmailAndPassword(email,senha);

        const dados={
            nome,
            nomeBusca:nome.toLowerCase(),
            email,
            avatar:"",
            xp:0,
            nivel:1,
            moedas:0,
            recorde:0,
            maiorPremio:0,
            partidas:0,
            vitorias:0,
            acertos:0,
            erros:0,
            titulo:"Novato",
            criadoEm:FV.serverTimestamp()
        };

        await db.collection("Usuarios").doc(cred.user.uid).set(dados);

        await salvarRanking();

        mostrarToast("Conta criada!");
    }catch(e){
        mostrarToast(traduzirErro(e));
    }
}

function traduzirErro(e){
    const codigo=e?.code||"";

    const erros={
        "auth/invalid-email":"E-mail inválido.",
        "auth/user-not-found":"Usuário não encontrado.",
        "auth/wrong-password":"Senha incorreta.",
        "auth/invalid-credential":"E-mail ou senha incorretos.",
        "auth/email-already-in-use":"Este e-mail já está cadastrado.",
        "auth/weak-password":"A senha é muito fraca."
    };

    return erros[codigo]||"Ocorreu um erro. Tente novamente.";
}

async function carregarPerfil(){
    if(!usuario)return;

    const ref=db.collection("Usuarios").doc(usuario.uid);
    const snap=await ref.get();

    if(snap.exists){
        perfil=snap.data();
    }else{
        perfil={
            nome:usuario.email?.split("@")[0]||"Jogador",
            nomeBusca:(usuario.email||"jogador").split("@")[0].toLowerCase(),
            email:usuario.email,
            avatar:"",
            xp:0,
            nivel:1,
            moedas:0,
            recorde:0,
            maiorPremio:0,
            partidas:0,
            vitorias:0,
            acertos:0,
            erros:0,
            titulo:"Novato"
        };

        await ref.set(perfil);
    }

    await salvarRanking();
}

async function salvarPerfil(dados={}){
    if(!usuario)return;

    perfil={...perfil,...dados};

    await db.collection("Usuarios")
        .doc(usuario.uid)
        .set(perfil,{merge:true});

    await salvarRanking();
}

async function salvarRanking(){
    if(!usuario||!perfil)return;

    try{
        await db.collection("Partidas")
            .doc("ranking_"+usuario.uid)
            .set({
                tipo:"ranking",
                uid:usuario.uid,
                nome:getNome(),
                nomeBusca:getNome().toLowerCase(),
                avatar:perfil.avatar||"",
                recorde:perfil.recorde||0,
                nivel:perfil.nivel||1,
                xp:perfil.xp||0,
                moedas:perfil.moedas||0,
                maiorPremio:perfil.maiorPremio||0,
                atualizadoEm:FV.serverTimestamp()
            },{merge:true});
    }catch(e){
        console.log(e);
    }
}

function nivelPergunta(i){
    if(i<=2)return "Fácil";
    if(i<=5)return "Médio";
    if(i<=8)return "Difícil";
    if(i<=11)return "Muito difícil";
    return "Especialista";
}

function prepararPerguntas(categoria){
    const banco=[...(perguntas[categoria]||perguntas.geral)];

    banco.sort(()=>Math.random()-0.5);

    const selecionadas=banco.slice(0,15);

    return selecionadas.map(q=>({
        pergunta:q[0],
        respostas:[...q[1]],
        correta:q[2]
    }));
}

function iniciarMilhao(categoria){
    fecharModal();

    jogo={
        categoria,
        perguntas:prepararPerguntas(categoria),
        indice:0,
        premio:0,
        acertos:0,
        erros:0,
        tempo:15,
        timer:null,
        respondeu:false,
        usadas:new Set()
    };

    mostrarPergunta();
    iniciarMusica("game");
}

function mostrarPergunta(){
    clearInterval(jogo.timer);

    const q=jogo.perguntas[jogo.indice];

    if(!q){
        finalizarJogo(true);
        return;
    }

    jogo.respondeu=false;
    jogo.tempo=15;

    const nivel=nivelPergunta(jogo.indice);

    $("conteudo").innerHTML=`
        <div class="top">
            <button class="btn btn-dark" onclick="sairDoJogo()">← Sair</button>
            <div class="prize">${formatarDinheiro(premios[jogo.indice])}</div>
        </div>

        <div class="card">
            <div class="center">
                <div>${jogo.indice+1} / 15</div>
                <div class="badge">${nivel}</div>
            </div>

            <div class="progress">
                <div style="width:${((jogo.indice)/15)*100}%"></div>
            </div>

            <div class="timer" id="timer">${jogo.tempo}</div>

            <div class="question">${escapeHtml(q.pergunta)}</div>

            <div id="respostas">
                ${q.respostas.map((r,i)=>`
                    <button class="answer" onclick="responder(${i})">
                        <b>${String.fromCharCode(65+i)}.</b> ${escapeHtml(r)}
                    </button>
                `).join("")}
            </div>

            <div class="row" style="margin-top:12px">
                <button class="btn btn-dark" onclick="usar5050()">50/50</button>
                <button class="btn btn-dark" onclick="pularPergunta()">Pular</button>
                <button class="btn btn-dark" onclick="usarDica()">Dica</button>
            </div>
        </div>
    `;

    iniciarTimer();
}

function iniciarTimer(){
    jogo.timer=setInterval(()=>{
        jogo.tempo--;

        const el=$("timer");
        if(el)el.textContent=jogo.tempo;

        if(jogo.tempo<=0){
            clearInterval(jogo.timer);
            responder(-1);
        }
    },1000);
}

function responder(indice){
    if(jogo.respondeu)return;

    jogo.respondeu=true;
    clearInterval(jogo.timer);

    const q=jogo.perguntas[jogo.indice];
    const botoes=document.querySelectorAll(".answer");

    if(indice===q.correta){
        if(botoes[indice])botoes[indice].classList.add("correct");

        jogo.acertos++;
        jogo.premio=premios[jogo.indice];

        tocarSom("correct");

        setTimeout(()=>{
            jogo.indice++;

            if(jogo.indice>=15){
                finalizarJogo(true);
            }else{
                mostrarPergunta();
            }
        },700);

    }else{
        if(indice>=0&&botoes[indice]){
            botoes[indice].classList.add("wrong");
        }

        if(botoes[q.correta]){
            botoes[q.correta].classList.add("correct");
        }

        jogo.erros++;
        tocarSom("wrong");

        setTimeout(()=>{
            finalizarJogo(false);
        },900);
    }
}

function usar5050(){
    if(jogo.respondeu)return;

    const q=jogo.perguntas[jogo.indice];
    const botoes=document.querySelectorAll(".answer");

    let removidas=0;

    [...Array(4).keys()]
        .sort(()=>Math.random()-0.5)
        .forEach(i=>{
            if(i!==q.correta&&removidas<2){
                botoes[i].style.visibility="hidden";
                removidas++;
            }
        });

    mostrarToast("Duas alternativas foram eliminadas.");
}

function pularPergunta(){
    if(jogo.respondeu)return;

    clearInterval(jogo.timer);

    jogo.indice++;

    if(jogo.indice>=15){
        finalizarJogo(true);
    }else{
        mostrarPergunta();
    }
}

function usarDica(){
    if(jogo.respondeu)return;

    mostrarToast("Dica: pense com calma e elimine as alternativas improváveis.");
}

async function finalizarJogo(vitoria){
    clearInterval(jogo.timer);

    const premioFinal=vitoria?jogo.premio:0;

    let xpGanho=Math.max(10,jogo.acertos*10);

    if(vitoria){
        xpGanho+=100;
    }

    const novoXP=(perfil.xp||0)+xpGanho;
    const novoNivel=Math.floor(novoXP/100)+1;

    const maior=Math.max(
        perfil.maiorPremio||0,
        premioFinal
    );

    const recorde=Math.max(
        perfil.recorde||0,
        premioFinal
    );

    await salvarPerfil({
        xp:novoXP,
        nivel:novoNivel,
        maiorPremio:maior,
        recorde,
        partidas:(perfil.partidas||0)+1,
        vitorias:(perfil.vitorias||0)+(vitoria?1:0),
        acertos:(perfil.acertos||0)+jogo.acertos,
        erros:(perfil.erros||0)+jogo.erros,
        moedas:(perfil.moedas||0)+(vitoria?50:5)
    });

    try{
        await db.collection("Partidas").add({
            uid:usuario.uid,
            nome:getNome(),
            categoria:jogo.categoria,
            acertos:jogo.acertos,
            erros:jogo.erros,
            premio:premioFinal,
            venceu:vitoria,
            criadoEm:FV.serverTimestamp()
        });
    }catch(e){
        console.log(e);
    }

    iniciarMusica("final");

    $("conteudo").innerHTML=`
        <div class="card center">
            <div style="font-size:65px">${vitoria?"🏆":"💥"}</div>

            <h1>${vitoria?"Parabéns!":"Fim de jogo"}</h1>

            <p>${vitoria?
                "Você completou o Desafio do Milhão!":
                "Você errou uma pergunta."
            }</p>

            <div class="big prize">
                ${formatarDinheiro(premioFinal)}
            </div>

            <p>Acertos: <b>${jogo.acertos}</b></p>
            <p>XP ganho: <b>+${xpGanho}</b></p>

            <button class="btn" onclick="central()">Voltar ao início</button>
            <button class="btn btn-dark" onclick="abrirRanking()">Ver ranking</button>
        </div>
    `;
}

async function carregarFoto(event){
    const arquivo=event.target.files?.[0];

    if(!arquivo)return;

    const leitor=new FileReader();

    leitor.onload=function(e){
        const img=new Image();

        img.onload=async function(){
            const canvas=document.createElement("canvas");
            canvas.width=256;
            canvas.height=256;

            const ctx=canvas.getContext("2d");

            const tamanho=Math.min(img.width,img.height);
            const x=(img.width-tamanho)/2;
            const y=(img.height-tamanho)/2;

            ctx.drawImage(
                img,
                x,y,tamanho,tamanho,
                0,0,256,256
            );

            const base64=canvas.toDataURL("image/jpeg",.7);

            await salvarPerfil({
                avatar:base64
            });

            mostrarToast("Foto atualizada!");
            abrirPerfil();
        };

        img.src=e.target.result;
    };

    leitor.readAsDataURL(arquivo);
}

async function verificarPresenca(uid){
    try{
        const snap=await db.collection("Partidas")
            .doc("presenca_"+uid)
            .get();

        const el=$("status_"+uid);

        if(!el)return;

        if(!snap.exists){
            el.textContent="Offline";
            el.className="offline";
            return;
        }

        const d=snap.data();

        const tempo=d.ultimaAtividade?.toMillis?.()||0;
        const online=d.online===true&&
            Date.now()-tempo<120000;

        el.textContent=online?"● Online":"○ Offline";
        el.className=online?"online":"offline";

    }catch(e){
        console.log(e);
    }
}

function iniciarMusica(track){
    if(!musicaLigada)return;

    try{
        if(!audioCtx){
            audioCtx=new(window.AudioContext||window.webkitAudioContext)();
        }

        if(audioCtx.state==="suspended"){
            audioCtx.resume();
        }

        pararMusica();

        let notas;

        if(track==="game"){
            notas=[220,277,330,440,330,277];
        }else if(track==="final"){
            notas=[262,330,392,523,659];
        }else{
            notas=[196,247,294,392,294,247];
        }

        let i=0;

        musicTimer=setInterval(()=>{
            if(!musicaLigada)return;

            const osc=audioCtx.createOscillator();
            const gain=audioCtx.createGain();

            osc.type="sine";
            osc.frequency.value=notas[i%notas.length];

            gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
                .025,
                audioCtx.currentTime+.03
            );
            gain.gain.exponentialRampToValueAtTime(
                .0001,
                audioCtx.currentTime+.25
            );

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime+.26);

            i++;
        },320);

    }catch(e){
        console.log(e);
    }
}

function pararMusica(){
    if(musicTimer){
        clearInterval(musicTimer);
        musicTimer=null;
    }
}

function tocarSom(tipo){
    if(!efeitosLigados)return;

    try{
        if(!audioCtx){
            audioCtx=new(window.AudioContext||window.webkitAudioContext)();
        }

        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();

        osc.type="triangle";

        if(tipo==="correct"){
            osc.frequency.value=660;
        }else if(tipo==="wrong"){
            osc.frequency.value=150;
        }else{
            osc.frequency.value=440;
        }

        gain.gain.value=.06;

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime+.18);
    }catch(e){}
}

function escapeHtml(text){
    return String(text||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function escapeAttr(text){
    return escapeHtml(text);
}
