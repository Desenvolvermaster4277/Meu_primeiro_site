<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0614">
<title>Minha Plataforma</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08050d;
  --panel:#120b1d;
  --panel2:#1a1028;
  --purple:#8b35ff;
  --purple2:#bd70ff;
  --text:#fff;
  --muted:#aaa0b8;
  --green:#29e58c;
  --red:#ff416c;
  --gold:#ffd34d;
  --border:rgba(255,255,255,.09);
}
body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% -10%,#35105c 0,#120820 30%,var(--bg) 65%);
  color:var(--text);
  min-height:100vh;
}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#app{min-height:100vh}
.screen{min-height:100vh;padding-bottom:90px}
.container{width:min(1100px,94%);margin:auto}
.topbar{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 4%;
  border-bottom:1px solid var(--border);
  background:rgba(8,5,13,.82);
  backdrop-filter:blur(15px);
  position:sticky;
  top:0;
  z-index:20;
}
.logo{
  font-weight:900;
  font-size:19px;
  letter-spacing:.5px;
}
.logo span{color:var(--purple2)}
.iconbtn{
  width:42px;height:42px;border:1px solid var(--border);
  background:var(--panel);color:white;border-radius:13px;
}
.hero{
  padding:42px 0 25px;
}
.hero h1{
  font-size:clamp(32px,7vw,58px);
  line-height:1;
  margin-bottom:12px;
}
.gradient{
  background:linear-gradient(90deg,#fff,#c87cff,#7b32ff);
  -webkit-background-clip:text;
  color:transparent;
}
.hero p{color:var(--muted);max-width:650px}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{
  background:linear-gradient(145deg,rgba(29,17,44,.95),rgba(13,8,20,.95));
  border:1px solid var(--border);
  border-radius:22px;
  padding:20px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}
.game-card{
  min-height:230px;
  position:relative;
  overflow:hidden;
}
.game-card:before{
  content:"";
  position:absolute;
  width:180px;height:180px;
  right:-60px;top:-60px;
  background:var(--purple);
  opacity:.13;
  filter:blur(5px);
  border-radius:50%;
}
.game-icon{font-size:42px;margin-bottom:20px}
.game-card h2{font-size:25px;margin-bottom:6px}
.game-card p{color:var(--muted);margin-bottom:20px}
.btn{
  border:0;
  color:white;
  background:linear-gradient(135deg,#6f20e8,#a23dff);
  border-radius:13px;
  padding:13px 18px;
  font-weight:800;
  box-shadow:0 8px 25px rgba(139,53,255,.22);
}
.btn:active{transform:scale(.98)}
.btn.secondary{
  background:var(--panel2);
  border:1px solid var(--border);
  box-shadow:none;
}
.btn.danger{background:linear-gradient(135deg,#d62450,#ff416c)}
.btn.gold{background:linear-gradient(135deg,#d79500,#ffd34d);color:#170f00}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.space{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stat-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
}
@media(max-width:650px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat{
 background:rgba(255,255,255,.035);
 border:1px solid var(--border);
 padding:14px;
 border-radius:15px;
}
.stat strong{display:block;font-size:20px;margin-top:4px}
.bottomnav{
 position:fixed;bottom:0;left:0;right:0;
 height:72px;background:rgba(10,6,16,.94);
 backdrop-filter:blur(20px);
 border-top:1px solid var(--border);
 display:flex;justify-content:space-around;z-index:50;
}
.navitem{
 flex:1;max-width:130px;
 background:none;border:0;color:#8d8498;
 font-size:11px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
}
.navitem.active{color:#c77cff}
.navitem b{font-size:21px}
.modal{
 position:fixed;inset:0;background:rgba(0,0,0,.75);
 backdrop-filter:blur(8px);
 display:flex;align-items:center;justify-content:center;
 z-index:100;padding:18px;
}
.modalbox{
 width:min(520px,100%);
 max-height:90vh;overflow:auto;
 background:#120b1d;
 border:1px solid var(--border);
 border-radius:24px;padding:22px;
}
input{
 width:100%;background:#0b0710;
 color:white;border:1px solid var(--border);
 border-radius:12px;padding:13px;margin:6px 0 12px;
 outline:none;
}
input:focus{border-color:var(--purple)}
.avatar{
 width:58px;height:58px;border-radius:50%;
 object-fit:cover;
 background:#251238;
 display:flex;align-items:center;justify-content:center;
 font-weight:900;font-size:22px;
 border:2px solid rgba(189,112,255,.45);
}
.profile-head{display:flex;align-items:center;gap:15px}
.xpbar{
 height:9px;background:#291b38;border-radius:20px;overflow:hidden;margin-top:8px;
}
.xpfill{
 height:100%;width:0;background:linear-gradient(90deg,#7020e8,#cf73ff);
 transition:.5s;
}
.badge{
 display:inline-flex;align-items:center;gap:5px;
 padding:6px 9px;border-radius:9px;
 background:#251533;border:1px solid var(--border);
 font-size:12px;
}
.locked{opacity:.35}
.list{display:flex;flex-direction:column;gap:10px}
.listitem{
 padding:13px;background:rgba(255,255,255,.035);
 border:1px solid var(--border);border-radius:15px;
}
.toast{
 position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
 background:#20102f;border:1px solid #7135a0;
 padding:12px 16px;border-radius:12px;z-index:200;
 box-shadow:0 10px 40px #000;
 max-width:90%;
}
.auth{
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
.authbox{width:min(430px,100%)}
.authlogo{text-align:center;margin-bottom:25px}
.authlogo div{font-size:45px}
.auth-tabs{display:flex;gap:6px;margin-bottom:18px}
.auth-tabs button{flex:1}
.question-wrap{padding-top:20px}
.money{
 font-size:clamp(28px,7vw,50px);
 font-weight:950;
 color:var(--gold);
 text-align:center;
 margin:10px 0;
}
.question{
 font-size:clamp(20px,4.5vw,32px);
 line-height:1.25;
 text-align:center;
 margin:25px auto;
 max-width:850px;
}
.timer{
 width:82px;height:82px;border-radius:50%;
 border:5px solid var(--purple);
 display:flex;align-items:center;justify-content:center;
 font-size:27px;font-weight:900;margin:15px auto;
}
.timer.warning{border-color:var(--red);color:var(--red)}
.answers{
 display:grid;grid-template-columns:1fr 1fr;gap:12px;
 max-width:850px;margin:auto;
}
@media(max-width:600px){.answers{grid-template-columns:1fr}}
.answer{
 background:#170e22;color:white;border:1px solid #342344;
 border-radius:15px;padding:17px;text-align:left;
 min-height:62px;font-weight:750;
 transition:.2s;
}
.answer:hover{border-color:#9a46dd}
.answer.correct{background:rgba(35,190,116,.22);border-color:var(--green)}
.answer.wrong{background:rgba(255,55,93,.22);border-color:var(--red)}
.answer.disabled{opacity:.45;pointer-events:none}
.game-controls{
 display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px;
}
.progress{
 height:7px;background:#24182e;border-radius:10px;overflow:hidden;margin:12px 0 20px;
}
.progress div{height:100%;background:linear-gradient(90deg,#7020e8,#cf73ff)}
.diff{
 text-align:center;font-size:12px;font-weight:900;letter-spacing:1px;
 color:#bd70ff;
}
.prize-list{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.prize{
 padding:5px 8px;border-radius:7px;background:#17101e;
 color:#9d94a6;font-size:10px;
}
.prize.current{color:#fff;background:#6223a0}
.prize.safe{color:#ffd34d}
.center{text-align:center}
.big{font-size:40px;font-weight:950}
.race-track{
 height:320px;
 background:
 linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/40px 40px,
 #110b18;
 border:1px solid var(--border);
 border-radius:20px;
 position:relative;
 overflow:hidden;
}
.lane{
 position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.12);
}
.car{
 position:absolute;
 width:42px;height:62px;
 border-radius:13px;
 background:linear-gradient(#bd70ff,#6720ce);
 display:flex;align-items:center;justify-content:center;
 font-size:22px;
 transition:left .3s;
}
.auth-msg{color:#ff7b96;min-height:20px;margin-bottom:8px}
hr{border:0;border-top:1px solid var(--border);margin:18px 0}
</style>
</head>

<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 updateProfile
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc,
 setDoc,
 updateDoc,
 addDoc,
 collection,
 query,
 where,
 getDocs,
 orderBy,
 limit,
 onSnapshot,
 serverTimestamp,
 arrayUnion,
 arrayRemove
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig={
 apiKey:"AIzaSyB-0j37BKkr0jt3B6NCl6-fNe3bqeQia08",
 authDomain:"desafio-do-milhao.firebaseapp.com",
 projectId:"desafio-do-milhao",
 storageBucket:"desafio-do-milhao.firebasestorage.app",
 messagingSenderId:"303629660012",
 appId:"1:303629660012:web:61bf5af93d9824e8100d49",
 measurementId:"G-0TZ68JLKJR"
};

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);

/* =========================================================
   ESTADO
========================================================= */

let user=null;
let profile=null;
let currentPage="home";
let game=null;
let timer=null;
let musicOn=true;
let soundOn=true;
let audioCtx=null;
let unsubscribeFriends=null;
let unsubscribeNotifications=null;

const app=document.getElementById("app");

/* =========================================================
   UTILIDADES
========================================================= */

function esc(v=""){
 return String(v)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function toast(msg){
 const el=document.getElementById("toast");
 el.textContent=msg;
 el.classList.remove("hidden");
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.classList.add("hidden"),2600);
}

function money(v){
 return Number(v||0).toLocaleString("pt-BR",{
  style:"currency",currency:"BRL",maximumFractionDigits:0
 });
}

function todayKey(){
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function initials(name){
 return (name||"Jogador")
 .split(" ")
 .slice(0,2)
 .map(x=>x[0])
 .join("")
 .toUpperCase();
}

function defaultProfile(){
 return {
  uid:user.uid,
  username:user.displayName||"Jogador",
  email:user.email||"",
  photo:"",
  xp:0,
  level:1,
  coins:0,
  title:"Novato",
  record:0,
  highestPrize:0,
  games:0,
  wins:0,
  losses:0,
  correct:0,
  wrong:0,
  bestStreak:0,
  currentStreak:0,
  achievements:[],
  friends:[],
  friendRequests:[],
  sentRequests:[],
  online:true,
  lastSeen:Date.now(),
  dailyChallenge:"",
  settings:{
   music:true,
   sound:true,
   theme:"dark"
  }
 };
}

async function loadProfile(){
 const ref=doc(db,"Usuarios",user.uid);
 const snap=await getDoc(ref);

 if(!snap.exists()){
  profile=defaultProfile();
  await setDoc(ref,profile);
 }else{
  profile={...defaultProfile(),...snap.data()};
  profile.settings={
   music:true,
   sound:true,
   ...(snap.data().settings||{})
  };
 }

 musicOn=profile.settings.music!==false;
 soundOn=profile.settings.sound!==false;
}

async function saveProfile(data){
 profile={...profile,...data};
 await updateDoc(doc(db,"Usuarios",user.uid),data);
}

function xpForLevel(level){
 return 100+(level-1)*75;
}

function levelFromXP(xp){
 let level=1;
 let needed=100;
 let remaining=xp;
 while(remaining>=needed){
  remaining-=needed;
  level++;
  needed=xpForLevel(level);
 }
 return level;
}

function titleForLevel(level){
 if(level>=30)return"Lenda";
 if(level>=20)return"Milionário";
 if(level>=15)return"Especialista";
 if(level>=10)return"Mestre";
 if(level>=6)return"Conhecedor";
 if(level>=3)return"Estudante";
 return"Novato";
}

async function addProgress(xp,coins){
 let newXP=(profile.xp||0)+xp;
 const oldLevel=profile.level||1;
 const newLevel=levelFromXP(newXP);

 const data={
  xp:newXP,
  level:newLevel,
  coins:(profile.coins||0)+coins,
  title:titleForLevel(newLevel)
 };

 await saveProfile(data);

 if(newLevel>oldLevel){
  await createNotification(
   `Você subiu para o nível ${newLevel}!`
  );
  toast(`🎉 Nível ${newLevel}!`);
 }
}

async function createNotification(text){
 try{
  await addDoc(collection(db,"Notificacoes"),{
   destinatario:user.uid,
   texto:text,
   lida:false,
   data:serverTimestamp()
  });
 }catch(e){}
}

function showPage(name){
 currentPage=name;
 render();
}

/* =========================================================
   AUTENTICAÇÃO
========================================================= */

function renderAuth(){
 app.innerHTML=`
 <div class="auth">
  <div class="authbox">
   <div class="authlogo">
    <div>🎮</div>
    <h1 class="gradient">MINHA PLATAFORMA</h1>
    <p class="muted">Sua central de jogos</p>
   </div>

   <div class="card">
    <div class="auth-tabs">
     <button class="btn" id="loginTab">Entrar</button>
     <button class="btn secondary" id="registerTab">Criar conta</button>
    </div>

    <div id="authForm"></div>
   </div>
  </div>
 </div>
 `;

 renderLoginForm();

 document.getElementById("loginTab").onclick=()=>{
  document.getElementById("loginTab").className="btn";
  document.getElementById("registerTab").className="btn secondary";
  renderLoginForm();
 };

 document.getElementById("registerTab").onclick=()=>{
  document.getElementById("loginTab").className="btn secondary";
  document.getElementById("registerTab").className="btn";
  renderRegisterForm();
 };
}

function renderLoginForm(){
 document.getElementById("authForm").innerHTML=`
  <h2>Entrar</h2>
  <p class="muted small">Entre na sua conta para continuar.</p>
  <br>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Senha">
  <div class="auth-msg" id="authMsg"></div>
  <button class="btn" style="width:100%" id="loginBtn">ENTRAR</button>
 `;

 document.getElementById("loginBtn").onclick=async()=>{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const msg=document.getElementById("authMsg");

  try{
   await signInWithEmailAndPassword(auth,email,password);
  }catch(e){
   msg.textContent="Email ou senha incorretos.";
  }
 };
}

function renderRegisterForm(){
 document.getElementById("authForm").innerHTML=`
  <h2>Criar conta</h2>
  <p class="muted small">Escolha o nome que aparecerá nos jogos.</p>
  <br>
  <input id="username" placeholder="Nome de usuário">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Senha">
  <div class="auth-msg" id="authMsg"></div>
  <button class="btn" style="width:100%" id="registerBtn">CRIAR CONTA</button>
 `;

 document.getElementById("registerBtn").onclick=async()=>{
  const username=document.getElementById("username").value.trim();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const msg=document.getElementById("authMsg");

  if(username.length<2){
   msg.textContent="Digite um nome válido.";
   return;
  }

  if(password.length<6){
   msg.textContent="A senha precisa ter pelo menos 6 caracteres.";
   return;
  }

  try{
   const cred=await createUserWithEmailAndPassword(auth,email,password);

   await updateProfile(cred.user,{displayName:username});

   const p=defaultProfile();
   p.username=username;
   p.email=email;

   await setDoc(doc(db,"Usuarios",cred.user.uid),p);

   toast("Conta criada!");
  }catch(e){
   if(e.code==="auth/email-already-in-use")
    msg.textContent="Este email já está cadastrado.";
   else
    msg.textContent="Não foi possível criar a conta.";
  }
 };
}

/* =========================================================
   HEADER / NAVEGAÇÃO
========================================================= */

function header(title="MINHA PLATAFORMA"){
 return`
 <header class="topbar">
  <div class="logo">🎮 <span>${esc(title)}</span></div>
  <div class="row">
   <button class="iconbtn" onclick="showNotifications()">🔔</button>
   <button class="iconbtn" onclick="showPage('profile')">
    ${profile?.photo
     ?`<img class="avatar" style="width:36px;height:36px" src="${esc(profile.photo)}">`
     :initials(profile?.username)}
   </button>
  </div>
 </header>
 `;
}

function bottomNav(){
 return`
 <nav class="bottomnav">
  <button class="navitem ${currentPage==="home"?"active":""}" onclick="showPage('home')">
   <b>🏠</b>Início
  </button>
  <button class="navitem ${currentPage==="ranking"?"active":""}" onclick="showPage('ranking')">
   <b>🏆</b>Ranking
  </button>
  <button class="navitem ${currentPage==="friends"?"active":""}" onclick="showPage('friends')">
   <b>👥</b>Amigos
  </button>
  <button class="navitem ${currentPage==="profile"?"active":""}" onclick="showPage('profile')">
   <b>👤</b>Perfil
  </button>
  <button class="navitem ${currentPage==="settings"?"active":""}" onclick="showPage('settings')">
   <b>⚙️</b>Config.
  </button>
 </nav>
 `;
}

   HOME
========================================================= */

/* =========================================================
   MENU DO DESAFIO DO MILHÃO
========================================================= */

function openMillion(){
 currentPage="millionMenu";
 renderMillionMenu();
}

function renderMillionMenu(){
 app.innerHTML=`
 ${header("DESAFIO DO MILHÃO")}
 <main class="screen">
  <div class="container">
   <section class="hero">
    <p class="muted">O jogo principal</p>
    <h1>💰 <span class="gradient">DESAFIO DO MILHÃO</span></h1>
    <p>Responda 15 perguntas e tente chegar ao prêmio máximo.</p>
   </section>

   <div class="grid">
    <div class="card">
     <h2>🎮 Jogar</h2>
     <p class="muted">Partida clássica de 15 perguntas.</p>
     <br>
     <button class="btn" onclick="startMillion()">COMEÇAR PARTIDA</button>
    </div>

    <div class="card">
     <h2>🏆 Ranking</h2>
     <p class="muted">Veja outros jogadores.</p>
     <br>
     <button class="btn secondary" onclick="showPage('ranking')">ABRIR RANKING</button>
    </div>

    <div class="card">
     <h2>👤 Perfil</h2>
     <p class="muted">Sua evolução no jogo.</p>
     <br>
     <button class="btn secondary" onclick="showPage('profile')">MEU PERFIL</button>
    </div>

function shuffle(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function prepareQuestion(q){
 const options=q.a.map((text,index)=>({
  text,
  correct:index===q.correct
 }));
 return{
  ...q,
  options:shuffle(options)
 };
}

function difficulty(n){
 if(n<=3)return"FÁCIL";
 if(n<=6)return"MÉDIO";
 if(n<=9)return"DIFÍCIL";
 if(n<=12)return"MUITO DIFÍCIL";
 return"ESPECIALISTA";
}

function startMillion(){
 const byDiff={
  1:shuffle(questions.filter(q=>q.d===1)).slice(0,3),
  2:shuffle(questions.filter(q=>q.d===2)).slice(0,3),
  3:shuffle(questions.filter(q=>q.d===3)).slice(0,3),
  4:shuffle(questions.filter(q=>q.d===4)).slice(0,3),
  5:shuffle(questions.filter(q=>q.d===5)).slice(0,3)
 };

 let selected=[
  ...byDiff[1],
  ...byDiff[2],
  ...byDiff[3],
  ...byDiff[4],
  ...byDiff[5]
 ];

 selected=selected.map(prepareQuestion);

 game={
  questions:selected,
  index:0,
  prize:0,
  correct:0,
  wrong:0,
  answered:0,
  streak:0,
  bestStreak:0,
  used:{
   fifty:false,
   skip:false,
   hint:false
  },
  ended:false,
  mode:"solo"
 };

 renderMillionGame();
}

function startTimer(){
 let seconds=15;
 const el=document.getElementById("timer");
 el.textContent=seconds;

 timer=setInterval(()=>{
  seconds--;
  if(!el)return;

  el.textContent=seconds;

  if(seconds<=5)el.classList.add("warning");

  if(seconds<=0){
   clearInterval(timer);
   answerMillion(null,true);
  }
 },1000);
}

function updateHelpButtons(){
 const f=document.getElementById("fiftyBtn");
 const s=document.getElementById("skipBtn");
 const h=document.getElementById("hintBtn");

 if(game.used.fifty)f.disabled=true;
 if(game.used.skip)s.disabled=true;
 if(game.used.hint)h.disabled=true;
}

function answerMillion(index,timeout=false){
 if(game.ended)return;

 clearInterval(timer);

 const q=game.questions[game.index];
 const buttons=[...document.querySelectorAll(".answer")];

 buttons.forEach(b=>b.disabled=true);

 let correctIndex=q.options.findIndex(x=>x.correct);

 if(index!==null && q.options[index].correct){
  buttons[index].classList.add("correct");
  game.correct++;
  game.answered++;
  game.streak++;
  game.bestStreak=Math.max(game.bestStreak,game.streak);
  game.prize=prizeValues[game.index];

  playSound("correct");
 }else{
  if(index!==null)buttons[index].classList.add("wrong");
  buttons[correctIndex]?.classList.add("correct");

  game.wrong++;
  game.answered++;
  game.streak=0;

  if(timeout)toast("⏰ Tempo esgotado!");
  playSound("wrong");
 }

 setTimeout(()=>{
  if(game.index>=14){
   finishMillion();
  }else{
   game.index++;
   renderMillionGame();
  }
 },900);
}

function useFifty(){
 if(game.used.fifty)return;

 game.used.fifty=true;

 const q=game.questions[game.index];
 const wrong=q.options
 .map((x,i)=>x.correct?-1:i)
 .filter(i=>i!==-1);

 const remove=shuffle(wrong).slice(0,2);

 remove.forEach(i=>{
  const el=document.getElementById("ans"+i);
  if(el){
   el.disabled=true;
   el.classList.add("disabled");
  }
 });

 updateHelpButtons();
 playSound("click");
}

function useSkip(){
 if(game.used.skip)return;

 game.used.skip=true;
 clearInterval(timer);
 toast("⏭️ Pergunta pulada.");

 setTimeout(()=>{
  if(game.index>=14)finishMillion();
  else{
   game.index++;
   renderMillionGame();
  }
 },500);
}

function useHint(){
 if(game.used.hint)return;

 game.used.hint=true;

 const q=game.questions[game.index];

 document.getElementById("hintArea").innerHTML=`
 <div class="card center" style="margin-top:15px">
  💡 <b>Dica</b>
  <p class="muted">${esc(q.hint)}</p>
 </div>
 `;

 updateHelpButtons();
 playSound("click");
}

async function finishMillion(){
 clearInterval(timer);

 game.ended=true;

 const xp=game.correct*25+Math.floor(game.prize/10000);
 const coins=game.correct*5+Math.floor(game.prize/100000);

 const newRecord=Math.max(profile.record||0,game.prize);
 const newHighest=Math.max(profile.highestPrize||0,game.prize);
 const games=(profile.games||0)+1;
 const wins=game.correct>=10?(profile.wins||0)+1:profile.wins||0;
 const losses=game.correct<10?(profile.losses||0)+1:profile.losses||0;

 await saveProfile({
  record:newRecord,
  highestPrize:newHighest,
  games,
  wins,
  losses,
  correct:(profile.correct||0)+game.correct,
  wrong:(profile.wrong||0)+game.wrong,
  bestStreak:Math.max(profile.bestStreak||0,game.bestStreak)
 });

 await addProgress(xp,coins);
 await checkAchievements(game,xp);

 await publishRanking();

 if(game.prize>=1000000)playSound("million");
 else if(game.prize>=500000)playSound("high");
 else playSound("victory");

 renderMillionResult(xp,coins);
}

async function checkAchievements(g,xp){
 const unlocked=new Set(profile.achievements||[]);
 const add=[];

 const checks=[
  ["first","🎯 Primeira vitória","Vença sua primeira partida.",profile.wins>=1],
  ["correct10","🔟 10 respostas certas","Acerte 10 perguntas.",profile.correct>=10],
  ["correct50","🔥 50 respostas certas","Acerte 50 perguntas.",profile.correct>=50],
  ["correct100","💯 100 respostas certas","Acerte 100 perguntas.",profile.correct>=100],
  ["100k","💵 R$100.000","Chegue a R$100.000.",g.prize>=100000],
  ["500k","💎 R$500.000","Chegue a R$500.000.",g.prize>=500000],
  ["million","👑 Milionário","Chegue a R$1.000.000.",g.prize>=1000000],
  ["games10","🎮 10 partidas","Jogue 10 partidas.",profile.games>=10],
  ["games50","🏆 50 partidas","Jogue 50 partidas.",profile.games>=50],
  ["streak5","🔥 Sequência de 5","Acerte 5 seguidas.",g.bestStreak>=5],
  ["streak10","⚡ Sequência de 10","Acerte 10 seguidas.",g.bestStreak>=10]
 ];

 for(const x of checks){
  if(x[3]&&!unlocked.has(x[0])){
   unlocked.add(x[0]);
   add.push(x[0]);
   await createNotification(`🏅 Conquista desbloqueada: ${x[1]}`);
  }
 }

 if(add.length){
  await saveProfile({achievements:[...unlocked]});
 }
}

async function answerDaily(i,el){
 const q=dailyQuestion();

 document.querySelectorAll(".answer").forEach(b=>b.disabled=true);

 if(q.options[i].correct){
  el.classList.add("correct");

  await saveProfile({
   dailyChallenge:todayKey()
  });

  await addProgress(40,15);
  await createNotification("🎯 Você completou o desafio diário!");
  toast("Acertou! +40 XP e +15 moedas.");
 }else{
  el.classList.add("wrong");
  const correct=q.options.findIndex(x=>x.correct);
  document.querySelectorAll(".answer")[correct]?.classList.add("correct");

  await saveProfile({
   dailyChallenge:todayKey()
  });

  toast("Resposta incorreta. Desafio concluído.");
 }
}

function changePhoto(){
 const input=document.createElement("input");
 input.type="file";
 input.accept="image/*";

 input.onchange=async()=>{
  const file=input.files[0];
  if(!file)return;

  const img=new Image();
  const reader=new FileReader();

  reader.onload=e=>{
   img.onload=async()=>{
    const canvas=document.createElement("canvas");
    canvas.width=256;
    canvas.height=256;

    const ctx=canvas.getContext("2d");

    const size=Math.min(img.width,img.height);
    const sx=(img.width-size)/2;
    const sy=(img.height-size)/2;

    ctx.drawImage(
     img,sx,sy,size,size,0,0,256,256
    );

    const data=canvas.toDataURL("image/jpeg",.72);

    try{
     await saveProfile({photo:data});

     await publishRanking();

     toast("Foto atualizada!");
     renderProfile();
    }catch(err){
     toast("Não foi possível salvar a foto.");
    }
   };

   img.src=e.target.result;
  };

  reader.readAsDataURL(file);
 };

 input.click();
}

       style="left:${p.position}%;top:${10+i*(70/race.players.length)}%">
       🏎️
      </div>
     `).join("")}
    </div>

    <br>

    <div class="grid">
     ${race.players.map((p,i)=>`
      <div class="card center">
       <h3>${esc(p.name)}</h3>
       <button class="btn" style="width:100%;margin-top:10px"
        onclick="accelerate(${i})">
        ⚡ ACELERAR
       </button>
      </div>
     `).join("")}
    </div>
   </div>
  </div>
 </main>
 `;

 raceInterval=setInterval(()=>{
  const elapsed=Date.now()-race.started;
  const remaining=Math.max(0,Math.ceil((race.duration-elapsed)/1000));

  const time=document.getElementById("raceTime");
  if(time)time.textContent=remaining+"s";

  if(remaining<=0){
   finishRace();
  }
 },100);
}

function accelerate(i){
 if(!race||race.players[i].finished)return;

 race.players[i].position=Math.min(
  92,
  race.players[i].position+Math.random()*8+4
 );

 const car=document.getElementById("car"+i);
 if(car)car.style.left=race.players[i].position+"%";

 playSound("click");

 if(race.players[i].position>=92){
  race.players[i].finished=true;
  finishRace();
 }
}

async function finishRace(){
 if(!race)return;

 clearInterval(raceInterval);

 const sorted=[...race.players].sort((a,b)=>b.position-a.position);
 const winner=sorted[0];

 await addProgress(
  winner.name===profile.username?50:15,
  winner.name===profile.username?20:5
 );

 app.innerHTML=`
 ${header("RESULTADO DA CORRIDA")}
 <main class="screen">
  <div class="container">
   <div class="card center">
    <div style="font-size:65px">🏁</div>
    <h1 class="gradient">CORRIDA ENCERRADA</h1>
    <br>

    ${sorted.map((p,i)=>`
     <div class="listitem space">
      <b>${i+1}º ${esc(p.name)}</b>
      <span>${Math.round(p.position)}%</span>
     </div>
    `).join("")}

    <br>
    <h2>🏆 Vencedor: ${esc(winner.name)}</h2>

    <br>

    <button class="btn" onclick="startRace(${race.players.length})">
     JOGAR NOVAMENTE
    </button>

    <button class="btn secondary" style="margin-left:7px"
     onclick="openRace()">
     VOLTAR
    </button>
   </div>
  </div>
 </main>
 `;
}

/* =========================================================
   ÁUDIO WEB AUDIO
========================================================= */

function audio(){
 if(!audioCtx){
  audioCtx=new(
   window.AudioContext||window.webkitAudioContext
  )();
 }
 if(audioCtx.state==="suspended")audioCtx.resume();
 return audioCtx;
}

function tone(freq,duration,type="sine",volume=.04){
 if(!soundOn)return;

 try{
  const ctx=audio();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(volume,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
   .001,
   ctx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start();
  osc.stop(ctx.currentTime+duration);
 }catch(e){}
}

function playSound(type){
 if(!soundOn)return;

 if(type==="correct"){
  tone(660,.12,"sine",.06);
  setTimeout(()=>tone(880,.16,"sine",.05),100);
 }

 if(type==="wrong"){
  tone(180,.25,"sawtooth",.04);
 }

 if(type==="click"){
  tone(420,.05,"sine",.025);
 }

 if(type==="victory"){
  tone(523,.15);
  setTimeout(()=>tone(659,.15),120);
  setTimeout(()=>tone(784,.3),240);
 }

 if(type==="high"){
  tone(523,.15);
  setTimeout(()=>tone(659,.15),120);
  setTimeout(()=>tone(784,.15),240);
  setTimeout(()=>tone(1046,.5),360);
 }

 if(type==="million"){
  const notes=[523,659,784,1046,1318];
  notes.forEach((n,i)=>setTimeout(()=>tone(n,.35,"triangle",.07),i*150));
 }
}

function toggleSound(){
 soundOn=!soundOn;
 saveProfile({
  settings:{...profile.settings,sound:soundOn}

 toast(soundOn?"🔊 Som ligado":"🔇 Som desligado");

}

function toggleMusic(){
 musicOn=!musicOn;
 saveProfile({

}
