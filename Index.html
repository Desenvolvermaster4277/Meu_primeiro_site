<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xadrez IA</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #111827, #1e293b);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 650px;
    text-align: center;
}

h1 {
    margin: 0 0 8px;
    font-size: 34px;
}

.subtitle {
    color: #cbd5e1;
    margin-bottom: 20px;
}

.status {
    background: #0f172a;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 15px;
    font-weight: bold;
}

.board {
    width: min(92vw, 600px);
    height: min(92vw, 600px);
    max-width: 600px;
    max-height: 600px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    border: 5px solid #0f172a;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,.4);
}

.square {
    aspect-ratio: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(30px, 9vw, 62px);
    cursor: pointer;
    user-select: none;
    position: relative;
}

.light {
    background: #f0d9b5;
}

.dark {
    background: #b58863;
}

.selected {
    box-shadow: inset 0 0 0 5px #facc15;
}

.possible {
    box-shadow: inset 0 0 0 5px rgba(34,197,94,.65);
}

.last {
    background: #c9b458 !important;
}

.controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 18px;
    flex-wrap: wrap;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 13px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: #2563eb;
    color: white;
}

button:hover {
    background: #1d4ed8;
}

.info {
    margin-top: 18px;
    background: rgba(15,23,42,.8);
    padding: 15px;
    border-radius: 12px;
    color: #cbd5e1;
    font-size: 14px;
}

.move-list {
    margin-top: 15px;
    max-height: 130px;
    overflow-y: auto;
    text-align: left;
    background: #0f172a;
    border-radius: 10px;
    padding: 12px;
    color: #e2e8f0;
}
</style>
</head>

<body>

<div class="container">

    <h1>♟️ Xadrez IA</h1>
    <div class="subtitle">Jogue contra o computador</div>

    <div class="status" id="status">
        Sua vez — você joga com as brancas
    </div>

    <div class="board" id="board"></div>

    <div class="controls">
        <button onclick="newGame()">🔄 Novo jogo</button>
    </div>

    <div class="move-list" id="moves">
        <strong>Jogadas:</strong>
    </div>

    <div class="info">
        Você joga com as peças brancas. Clique em uma peça e depois
        clique na casa para onde deseja movê-la.
    </div>

</div>

<script>

const pieces = {
    wK: "♔",
    wQ: "♕",
    wR: "♖",
    wB: "♗",
    wN: "♘",
    wP: "♙",

    bK: "♚",
    bQ: "♛",
    bR: "♜",
    bB: "♝",
    bN: "♞",
    bP: "♟"
};

let board = [];
let selected = null;
let turn = "w";
let gameOver = false;
let lastMove = null;
let moveHistory = [];

function newGame() {

    board = [
        ["bR","bN","bB","bQ","bK","bB","bN","bR"],
        ["bP","bP","bP","bP","bP","bP","bP","bP"],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        [null,null,null,null,null,null,null,null],
        ["wP","wP","wP","wP","wP","wP","wP","wP"],
        ["wR","wN","wB","wQ","wK","wB","wN","wR"]
    ];

    selected = null;
    turn = "w";
    gameOver = false;
    lastMove = null;
    moveHistory = [];

    document.getElementById("status").textContent =
        "Sua vez — você joga com as brancas";

    render();
}

function render() {

    const boardElement = document.getElementById("board");
    boardElement.innerHTML = "";

    for(let r = 0; r < 8; r++) {

        for(let c = 0; c < 8; c++) {

            const square = document.createElement("div");

            square.className =
                "square " + ((r+c)%2 === 0 ? "light" : "dark");

            if(lastMove &&
               ((lastMove.from.r === r && lastMove.from.c === c) ||
                (lastMove.to.r === r && lastMove.to.c === c))) {
                square.classList.add("last");
            }

            if(selected &&
               selected.r === r &&
               selected.c === c) {
                square.classList.add("selected");
            }

            if(selected) {

                const moves = getLegalMoves(selected.r, selected.c);

                if(moves.some(m => m.r === r && m.c === c)) {
                    square.classList.add("possible");
                }
            }

            const piece = board[r][c];

            if(piece) {
                square.textContent = pieces[piece];
            }

            square.onclick = () => clickSquare(r,c);

            boardElement.appendChild(square);
        }
    }

    updateMoves();
}

function clickSquare(r,c) {

    if(gameOver || turn !== "w") return;

    const piece = board[r][c];

    if(selected) {

        const moves = getLegalMoves(selected.r, selected.c);

        const valid = moves.some(
            m => m.r === r && m.c === c
        );

        if(valid) {

            movePiece(
                selected.r,
                selected.c,
                r,
                c
            );

            selected = null;

            render();

            setTimeout(computerMove, 500);

            return;
        }

        if(piece && piece[0] === "w") {

            selected = {r,c};
            render();
            return;
        }

        selected = null;
        render();
        return;
    }

    if(piece && piece[0] === "w") {

        selected = {r,c};
        render();
    }
}

function movePiece(fr,fc,tr,tc) {

    const piece = board[fr][fc];

    const captured = board[tr][tc];

    board[tr][tc] = piece;
    board[fr][fc] = null;

    // Promoção simples para dama
    if(piece === "wP" && tr === 0) {
        board[tr][tc] = "wQ";
    }

    if(piece === "bP" && tr === 7) {
        board[tr][tc] = "bQ";
    }

    lastMove = {
        from:{r:fr,c:fc},
        to:{r:tr,c:tc}
    };

    moveHistory.push(
        `${turn === "w" ? "Você" : "IA"}: ${piece} ${fr+1},${fc+1} → ${tr+1},${tc+1}` +
        (captured ? " ⚔️" : "")
    );

    turn = turn === "w" ? "b" : "w";

    checkGameState();
}

function getLegalMoves(r,c) {

    const piece = board[r][c];

    if(!piece) return [];

    const color = piece[0];
    const type = piece[1];

    let moves = [];

    if(type === "P") {

        const direction = color === "w" ? -1 : 1;

        const startRow = color === "w" ? 6 : 1;

        const one = r + direction;

        if(inBounds(one,c) && !board[one][c]) {

            moves.push({r:one,c});

            const two = r + direction*2;

            if(r === startRow && !board[two][c]) {
                moves.push({r:two,c});
            }
        }

        for(const dc of [-1,1]) {

            const nr = r + direction;
            const nc = c + dc;

            if(inBounds(nr,nc) &&
               board[nr][nc] &&
               board[nr][nc][0] !== color) {

                moves.push({r:nr,c:nc});
            }
        }
    }

    if(type === "N") {

        const jumps = [
            [-2,-1],[-2,1],
            [-1,-2],[-1,2],
            [1,-2],[1,2],
            [2,-1],[2,1]
        ];

        for(const [dr,dc] of jumps) {

            const nr = r+dr;
            const nc = c+dc;

            if(inBounds(nr,nc) &&
               (!board[nr][nc] ||
                board[nr][nc][0] !== color)) {

                moves.push({r:nr,c:nc});
            }
        }
    }

    if(type === "K") {

        for(let dr=-1;dr<=1;dr++) {

            for(let dc=-1;dc<=1;dc++) {

                if(dr===0 && dc===0) continue;

                const nr=r+dr;
                const nc=c+dc;

                if(inBounds(nr,nc) &&
                   (!board[nr][nc] ||
                    board[nr][nc][0] !== color)) {

                    moves.push({r:nr,c:nc});
                }
            }
        }
    }

    if(type === "B" || type === "Q") {

        moves.push(
            ...slideMoves(
                r,c,color,
                [[-1,-1],[-1,1],[1,-1],[1,1]]
            )
        );
    }

    if(type === "R" || type === "Q") {

        moves.push(
            ...slideMoves(
                r,c,color,
                [[-1,0],[1,0],[0,-1],[0,1]]
            )
        );
    }

    return moves;
}

function slideMoves(r,c,color,directions) {

    const moves = [];

    for(const [dr,dc] of directions) {

        let nr = r+dr;
        let nc = c+dc;

        while(inBounds(nr,nc)) {

            if(!board[nr][nc]) {

                moves.push({r:nr,c:nc});

            } else {

                if(board[nr][nc][0] !== color) {
                    moves.push({r:nr,c:nc});
                }

                break;
            }

            nr += dr;
            nc += dc;
        }
    }

    return moves;
}

function inBounds(r,c) {

    return r >= 0 &&
           r < 8 &&
           c >= 0 &&
           c < 8;
}

function allMoves(color) {

    const result = [];

    for(let r=0;r<8;r++) {

        for(let c=0;c<8;c++) {

            if(board[r][c] &&
               board[r][c][0] === color) {

                const moves =
                    getLegalMoves(r,c);

                for(const move of moves) {

                    result.push({
                        from:{r,c},
                        to:move
                    });
                }
            }
        }
    }

    return result;
}

function computerMove() {

    if(gameOver) return;

    const moves = allMoves("b");

    if(moves.length === 0) {

        endGame("🏆 Você venceu!");

        return;
    }

    let bestMove = null;
    let bestScore = -Infinity;

    for(const move of moves) {

        const captured =
            board[move.to.r][move.to.c];

        let score = Math.random() * 5;

        if(captured) {

            const values = {
                P:10,
                N:30,
                B:30,
                R:50,
                Q:90,
                K:900
            };

            score += values[captured[1]] || 0;
        }

        if(score > bestScore) {

            bestScore = score;
            bestMove = move;
        }
    }

    movePiece(
        bestMove.from.r,
        bestMove.from.c,
        bestMove.to.r,
        bestMove.to.c
    );

    render();

    if(!gameOver) {

        document.getElementById("status").textContent =
            "Sua vez — você joga com as brancas";
    }
}

function checkGameState() {

    const whiteMoves = allMoves("w");
    const blackMoves = allMoves("b");

    if(turn === "w" && whiteMoves.length === 0) {

        endGame("🤖 A IA venceu!");

    } else if(turn === "b" && blackMoves.length === 0) {

        endGame("🏆 Você venceu!");

    } else {

        document.getElementById("status").textContent =
            turn === "w"
            ? "Sua vez — você joga com as brancas"
            : "🤖 A IA está pensando...";
    }
}

function endGame(message) {

    gameOver = true;

    document.getElementById("status").textContent =
        message;
}

function updateMoves() {

    const element =
        document.getElementById("moves");

    element.innerHTML =
        "<strong>Jogadas:</strong><br>" +
        (moveHistory.length
            ? moveHistory.join("<br>")
            : "Nenhuma jogada ainda.");
}

newGame();

</script>

</body>
</html>
