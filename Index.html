<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#140021">
<title>Desafio do Milhão</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#3b0b55 0,#160024 38%,#08000d 100%);
    color:white;
    min-height:100vh;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

.app{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:15px;
}

/* LOGIN */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:rgba(24,5,38,.94);
    border:1px solid #71359a;
    border-radius:24px;
    padding:30px 22px;
    box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    font-size:34px;
    color:#d7a7ff;
}

.logo p{
    color:#bba7c8;
    margin-top:5px;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;
    color:#d7c7df;
    font-size:14px;
    margin-bottom:6px;
}

.field input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #65427b;
    background:#100019;
    color:white;
    outline:none;
}

.field input:focus{
    border-color:#b768ff;
}

.primary{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px;
    color:white;
    font-weight:bold;
    background:linear-gradient(135deg,#8d38c9,#c15dff);
    margin-top:5px;
}

.secondary{
    width:100%;
    border:1px solid #71488a;
    border-radius:13px;
    padding:12px;
    color:white;
    background:#251033;
    margin-top:9px;
}

.message{
    text-align:center;
    margin-top:12px;
    min-height:20px;
    color:#ff9c9c;
    font-size:14px;
}

/* HEADER */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.brand{
    font-size:25px;
    font-weight:bold;
    color:#dfb5ff;
}

.user-mini{
    display:flex;
    align-items:center;
    gap:8px;
    background:#21102d;
    border:1px solid #59346d;
    border-radius:30px;
    padding:7px 11px;
}

.avatar{
    width:35px;
    height:35px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#7e35aa;
    font-size:20px;
}

.user-mini span{
    max-width:130px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

/* CARDS */

.card{
    background:rgba(28,8,43,.94);
    border:1px solid #57326b;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
}

.menu-title{
    text-align:center;
    margin:10px 0 20px;
}

.menu-title h2{
    font-size:28px;
}

.menu-title p{
    color:#bcaac6;
    margin-top:5px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.menu-btn{
    padding:18px 10px;
    border-radius:16px;
    border:1px solid #663d7a;
    background:#21102d;
    color:white;
    font-weight:bold;
    transition:.2s;
}

.menu-btn:hover{
    transform:translateY(-2px);
    border-color:#b15be8;
    background:#2d1240;
}

.menu-btn .emoji{
    display:block;
    font-size:27px;
    margin-bottom:5px;
}

.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:15px;
}

.action-btn{
    padding:13px;
    border:1px solid #68417b;
    background:#21102d;
    color:white;
    border-radius:12px;
}

/* GAME */

.game-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
    margin-bottom:12px;
}

.category-label{
    color:#cda6e4;
    font-size:14px;
}

.prize{
    color:#ffd66b;
    font-size:22px;
    font-weight:bold;
}

.timer-wrap{
    height:10px;
    background:#2c1738;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:15px;
}

.timer-bar{
    height:100%;
    width:100%;
    background:#9c4bd0;
    transition:width 1s linear;
}

.timer-text{
    text-align:center;
    font-weight:bold;
    margin-bottom:12px;
}

.streak{
    text-align:center;
    color:#ffca63;
    min-height:21px;
    margin-bottom:8px;
}

.question{
    font-size:22px;
    line-height:1.4;
    text-align:center;
    margin:20px 0;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.answer{
    border:1px solid #654178;
    background:#21102d;
    color:white;
    border-radius:14px;
    padding:15px 12px;
    text-align:left;
    min-height:65px;
    transition:.15s;
}

.answer:hover:not(:disabled){
    border-color:#b35ee8;
}

.answer.correct{
    background:#14552d;
    border-color:#46d77d;
}

.answer.wrong{
    background:#641d2b;
    border-color:#ff5c70;
}

.answer:disabled{
    cursor:default;
}

.lifelines{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.life{
    border:1px solid #704783;
    background:#251033;
    color:white;
    border-radius:12px;
    padding:12px 5px;
}

.life.used{
    opacity:.35;
}

.next-btn{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:13px;
    background:#9b45cf;
    color:white;
    font-weight:bold;
}

.progress{
    text-align:center;
    color:#bda9c8;
    margin-top:12px;
}

/* PRIZE TABLE */

.prize-table{
    margin-top:15px;
    border:1px solid #553067;
    border-radius:15px;
    overflow:hidden;
}

.prize-table div{
    display:flex;
    justify-content:space-between;
    padding:7px 11px;
    font-size:13px;
    color:#c9b5d4;
}

.prize-table div.current{
    background:#67328a;
    color:white;
    font-weight:bold;
}

/* PROFILE */

.profile-head{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.big-avatar{
    width:75px;
    height:75px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#8139a9;
    font-size:40px;
    flex:none;
}

.profile-name{
    font-size:24px;
    font-weight:bold;
}

.profile-email{
    color:#bda9c8;
    margin-top:5px;
    overflow-wrap:anywhere;
    word-break:break-word;
    white-space:normal;
    max-width:100%;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.stat{
    background:#21102d;
    border:1px solid #563369;
    border-radius:13px;
    padding:14px;
    min-width:0;
}

.stat strong{
    display:block;
    font-size:20px;
    color:#e1b7ff;
    overflow-wrap:anywhere;
}

.stat span{
    color:#a994b1;
    font-size:13px;
}

/* ACHIEVEMENTS */

.achievements{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.badge{
    border:1px solid #543367;
    background:#21102d;
    border-radius:15px;
    padding:15px;
    opacity:.38;
}

.badge.unlocked{
    opacity:1;
    border-color:#bd6df0;
    background:#301044;
}

.badge .badge-icon{
    font-size:30px;
}

.badge h4{
    margin-top:5px;
}

.badge p{
    color:#ad99b9;
    font-size:12px;
    margin-top:4px;
}

/* RANKING */

.rank-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border-bottom:1px solid #382044;
}

.rank-row:last-child{
    border-bottom:0;
}

.rank-number{
    width:30px;
    font-weight:bold;
    color:#ffc963;
}

.rank-avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#75349b;
}

.rank-name{
    flex:1;
    min-width:0;
}

.rank-name strong{
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.rank-name small{
    color:#9d8ca8;
}

.rank-score{
    font-weight:bold;
    color:#ffd56b;
}

/* ONLINE */

.online-player{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border:1px solid #4e2e60;
    background:#1c0b29;
    border-radius:13px;
    margin-bottom:9px;
}

.online-dot{
    width:10px;
    height:10px;
    background:#39e47b;
    border-radius:50%;
    box-shadow:0 0 10px #39e47b;
}

.online-player .name{
    flex:1;
}

.challenge{
    border:0;
    background:#8c3bbd;
    color:white;
    border-radius:9px;
    padding:8px 11px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:20;
}

.modal-box{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    background:#1d092b;
    border:1px solid #6a3b7e;
    border-radius:20px;
    padding:20px;
}

.modal-box h2{
    margin-bottom:15px;
}

.close{
    float:right;
    background:none;
    border:0;
    color:white;
    font-size:25px;
}

/* RESULT */

.result{
    text-align:center;
}

.result-icon{
    font-size:70px;
}

.result h2{
    font-size:30px;
    margin:10px 0;
}

.result .money{
    color:#ffd265;
    font-size:32px;
    font-weight:bold;
}

.result-stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin:20px 0;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(100px);
    background:#30103f;
    border:1px solid #8e4cb0;
    border-radius:13px;
    padding:13px 18px;
    z-index:100;
    transition:.3s;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    max-width:90%;
    text-align:center;
}

.toast.show{
    transform:translateX(-50%) translateY(0);
}

/* RESPONSIVE */

@media(max-width:600px){
    .grid,
    .answers{
        grid-template-columns:1fr;
    }

    .actions{
        grid-template-columns:1fr 1fr;
    }

    .question{
        font-size:19px;
    }

    .brand{
        font-size:20px;
    }

    .user-mini span{
        max-width:90px;
    }

    .achievements{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen">
    <div class="login-box">
        <div class="logo">
            <h1>💰 Desafio do Milhão</h1>
            <p>Teste seus conhecimentos</p>
        </div>

        <div class="field">
            <label>Nome</label>
            <input id="nomeCadastro" type="text" placeholder="Seu nome">
        </div>

        <div class="field">
            <label>E-mail</label>
            <input id="email" type="email" placeholder="seuemail@email.com">
        </div>

        <div class="field">
            <label>Senha</label>
            <input id="senha" type="password" placeholder="Mínimo de 6 caracteres">
        </div>

        <button class="primary" onclick="entrar()">Entrar</button>
        <button class="secondary" onclick="criarConta()">Criar conta</button>

        <div id="loginMessage" class="message"></div>
    </div>
</section>

<!-- APP -->

<main id="app" class="app hidden">

    <header class="topbar">
        <div class="brand">💰 Desafio do Milhão</div>

        <div class="user-mini">
            <div id="miniAvatar" class="avatar">😀</div>
            <span id="miniNome">Jogador</span>
        </div>
    </header>

    <!-- MENU -->

    <section id="menuScreen" class="card">

        <div class="menu-title">
            <h2>Escolha uma categoria</h2>
            <p>15 perguntas. Será que você chega ao milhão?</p>
        </div>

        <div class="grid">

            <button class="menu-btn" onclick="novoJogo('ciencia')">
                <span class="emoji">🔬</span>
                Ciência
            </button>

            <button class="menu-btn" onclick="novoJogo('matematica')">
                <span class="emoji">➗</span>
                Matemática
            </button>

            <button class="menu-btn" onclick="novoJogo('geografia')">
                <span class="emoji">🌎</span>
                Geografia
            </button>

            <button class="menu-btn" onclick="novoJogo('historia')">
                <span class="emoji">🏛️</span>
                História
            </button>

            <button class="menu-btn" onclick="novoJogo('tecnologia')">
                <span class="emoji">💻</span>
                Tecnologia
            </button>

            <button class="menu-btn" onclick="novoJogo('portugues')">
                <span class="emoji">📚</span>
                Português
            </button>

            <button class="menu-btn" onclick="novoJogo('geral')">
                <span class="emoji">🧠</span>
                Conhecimentos Gerais
            </button>

            <button class="menu-btn" onclick="desafioDiario()">
                <span class="emoji">🗓️</span>
                Desafio Diário
            </button>

        </div>

        <div class="actions">
            <button class="action-btn" onclick="abrirPerfil()">👤 Meu perfil</button>
            <button class="action-btn" onclick="abrirRanking()">🏆 Ranking</button>
            <button class="action-btn" onclick="abrirConquistas()">🎖️ Conquistas</button>
            <button class="action-btn" onclick="abrirOnline()">🌎 Jogar online</button>
            <button class="action-btn" onclick="abrirAmigos()">👥 Amigos</button>
            <button class="action-btn" onclick="abrirComoJogar()">❓ Como jogar</button>
            <button class="action-btn" onclick="alternarSom()">🔊 Som</button>
            <button class="action-btn" onclick="sair()">🚪 Sair</button>
        </div>

    </section>

    <!-- GAME -->

    <section id="gameScreen" class="card hidden">

        <div class="game-head">
            <div>
                <div id="gameCategory" class="category-label">Categoria</div>
                <div id="gamePlayer" class="category-label"></div>
            </div>

            <div id="gamePrize" class="prize">R$ 1.000</div>
        </div>

        <div class="timer-wrap">
            <div id="timerBar" class="timer-bar"></div>
        </div>

        <div id="timerText" class="timer-text">15s</div>

        <div id="streakText" class="streak"></div>

        <div id="questionText" class="question"></div>

        <div id="answers" class="answers"></div>

        <div class="lifelines">
            <button id="life5050" class="life" onclick="usar5050()">50/50</button>
            <button id="lifeSkip" class="life" onclick="pular()">⏭️ Pular</button>
            <button id="lifeHint" class="life" onclick="dica()">💡 Dica</button>
        </div>

        <button id="nextBtn" class="next-btn hidden" onclick="proxima()">
            Próxima pergunta →
        </button>

        <div id="progress" class="progress"></div>

        <div id="prizeTable" class="prize-table"></div>

    </section>

    <!-- RESULT -->

    <section id="resultScreen" class="card hidden">
        <div class="result">
            <div id="resultIcon" class="result-icon">🏆</div>
            <h2 id="resultTitle">Fim de jogo!</h2>
            <div id="resultMoney" class="money">R$ 0</div>

            <div id="resultStats" class="result-stats"></div>

            <button class="primary" onclick="voltarMenu()">Voltar ao menu</button>
        </div>
    </section>

</main>

<!-- MODAL -->

<div id="modal" class="modal hidden">
    <div id="modalBox" class="modal-box">
        <button class="close" onclick="fecharModal()">×</button>
        <div id="modalContent"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

/* =========================================================
   MATEMÁTICA EXTRA
========================================================= */

function gerarMatematicaExtra(){

    const lista = [...banco.matematica];
    const existentes = new Set(lista.map(x=>x[0]));

    let tentativas = 0;

    while(lista.length < 500 && tentativas < 5000){

        tentativas++;

        const a = Math.floor(Math.random()*100)+1;
        const b = Math.floor(Math.random()*50)+1;

        const tipo = Math.floor(Math.random()*4);

        let pergunta;
        let correta;
        let opcoes;

        if(tipo===0){
            pergunta = `Quanto é ${a} + ${b}?`;
            correta = a+b;
        }
        else if(tipo===1){
            const maior = Math.max(a,b);
            const menor = Math.min(a,b);
            pergunta = `Quanto é ${maior} - ${menor}?`;
            correta = maior-menor;
        }
        else if(tipo===2){
            pergunta = `Quanto é ${a} × ${b}?`;
            correta = a*b;
        }
        else{
            const produto = a*b;
            pergunta = `Quanto é ${produto} ÷ ${a}?`;
            correta = b;
        }

        if(existentes.has(pergunta)) continue;

        const alternativas = new Set([correta]);

        while(alternativas.size<4){
            const variacao =
                Math.max(
                    1,
                    correta + Math.floor(Math.random()*21)-10
                );

            alternativas.add(variacao);
        }

        opcoes = [...alternativas];

        // Embaralha mantendo a posição correta
        opcoes.sort(()=>Math.random()-.5);

        const indiceCorreto = opcoes.indexOf(correta);

        lista.push([
            pergunta,
            opcoes.map(String),
            indiceCorreto
        ]);

        existentes.add(pergunta);
    }

    banco.matematica = lista;
}

gerarMatematicaExtra();

function embaralhar(array){
    const a = [...array];

    for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }

    return a;
}


/*
  IMPORTANTE:
  Selecionamos 15 perguntas únicas pelo texto.
  Não usamos mais um banco de 25 repetido 20 vezes.
*/

function selecionarPerguntasUnicas(lista, quantidade=15){

    const mapa = new Map();

    lista.forEach(q=>{
        if(!mapa.has(q[0])){
            mapa.set(q[0],q);
        }
    });

    return embaralhar([...mapa.values()]).slice(
        0,
        Math.min(quantidade,mapa.size)
    );
}

/* =========================================================
   SOM
========================================================= */

let audioContext = null;

function som(frequencia,duracao=0.12,tipo="sine"){

    if(!somLigado) return;

    try{

        if(!audioContext){
            audioContext =
                new (window.AudioContext ||
                window.webkitAudioContext)();
        }

        const osc=audioContext.createOscillator();
        const gain=audioContext.createGain();

        osc.type=tipo;
        osc.frequency.value=frequencia;

        gain.gain.setValueAtTime(
            .08,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime+duracao
        );

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();
        osc.stop(audioContext.currentTime+duracao);

    }catch(e){}
}


function somAcerto(){
    som(660,.12);
    setTimeout(()=>som(880,.16),90);
}


function somErro(){
    som(180,.22,"sawtooth");
}


function somClique(){
    som(500,.05);
}


function somMilhao(){
    [523,659,784,1046].forEach((f,i)=>{
        setTimeout(()=>som(f,.22),i*120);
    });
}


function alternarSom(){

    somLigado=!somLigado;

    mostrarToast(
        somLigado
        ? "🔊 Sons ativados"
        : "🔇 Sons desativados"
    );

    if(somLigado) somClique();
}

auth.onAuthStateChanged(async user=>{

        await carregarDadosUsuario();

            .classList.add("hidden");

        document.getElementById("app")
            .classList.remove("hidden");

            .classList.remove("hidden");

        document.getElementById("app")
            .classList.add("hidden");
    }
});


async function criarConta(){

    const nome=document.getElementById("nomeCadastro").value.trim();
    const email=document.getElementById("email").value.trim();
    const senha=document.getElementById("senha").value;

    if(!nome || !email || !senha){

        mostrarLoginMensagem(
            "Preencha nome, e-mail e senha."
        );

        return;
    }

    if(senha.length<6){

        mostrarLoginMensagem(
            "A senha precisa ter pelo menos 6 caracteres."
        );

        return;
    }

    try{

        const cred=await auth.createUserWithEmailAndPassword(
            email,
            senha
        );

        const dados={
            nome,
            email,
            avatar:"😀",
            recorde:0,
            maiorPremio:0,
            partidas:0,
            acertos:0,
            sequencia:0,
            moedas:0,
            conquistas:[],
            criadoEm:firebase.firestore.FieldValue.serverTimestamp()
        };

        await db.collection("Usuarios")
            .doc(cred.user.uid)
            .set(dados);

        mostrarToast("Conta criada com sucesso!");

    }catch(error){

        console.error(error);

        mostrarLoginMensagem(
            traduzirErroFirebase(error)
        );
    }
}


async function entrar(){

    const email=document.getElementById("email").value.trim();
    const senha=document.getElementById("senha").value;

    if(!email || !senha){

        mostrarLoginMensagem(
            "Digite seu e-mail e senha."
        );

        return;
    }

    try{

        await auth.signInWithEmailAndPassword(
            email,
            senha
        );

    }catch(error){

        console.error(error);

        mostrarLoginMensagem(
            traduzirErroFirebase(error)
        );
    }
}


function sair(){

    if(timer) clearInterval(timer);

    if(onlineInterval)
        clearInterval(onlineInterval);

    auth.signOut();
}


function traduzirErroFirebase(error){

    const code=error.code||"";

    if(code.includes("email-already-in-use"))
        return "Este e-mail já está cadastrado.";

    if(code.includes("invalid-email"))
        return "E-mail inválido.";

    if(code.includes("wrong-password"))
        return "Senha incorreta.";

    if(code.includes("user-not-found"))
        return "Conta não encontrada.";

    if(code.includes("weak-password"))
        return "A senha é muito fraca.";

    if(code.includes("network"))
        return "Verifique sua conexão com a internet.";

    if(code.includes("permission-denied"))
        return "Permissão negada no Firebase.";

    return "Não foi possível realizar a ação.";
}

/* =========================================================

========================================================= */

function novoJogo(categoria){

    categoriaAtual=categoria;
    modoJogo="normal";
    desafioDiarioAtivo=false;

    iniciarJogo();
}


function iniciarJogo(){

    const lista=banco[categoriaAtual];

    if(!lista || !lista.length){

        mostrarToast("Categoria sem perguntas.");
        return;
    }

    /*
      Esta é a correção principal das perguntas repetidas.
      Pegamos somente perguntas únicas.
    */

    perguntas=selecionarPerguntasUnicas(lista,15);

    indice=0;
    acertos=0;
    premioAtual=0;
    maiorPremioPartida=0;
    sequencia=0;
    melhorSequenciaPartida=0;
    pontosVelocidade=0;

    usados={
        5050:false,
        skip:false,
        hint:false
    };

    document.getElementById("menuScreen")
        .classList.add("hidden");

    document.getElementById("resultScreen")
        .classList.add("hidden");

    document.getElementById("gameScreen")
        .classList.remove("hidden");

    document.getElementById("gameCategory")
        .textContent=nomesCategorias[categoriaAtual] ||
        "Desafio";

    document.getElementById("gamePlayer")
        .textContent=
        desafioDiarioAtivo
        ? "🗓️ Desafio Diário"
        : "";

    carregarPergunta();
}


function carregarPergunta(){

    if(indice>=perguntas.length){

        finalizar();
        return;
    }

    respondeu=false;
    respostaAtual=null;

    document.getElementById("nextBtn")
        .classList.add("hidden");

    document.getElementById("life5050")
        .classList.toggle("used",usados["5050"]);

    document.getElementById("lifeSkip")
        .classList.toggle("used",usados.skip);

    document.getElementById("lifeHint")
        .classList.toggle("used",usados.hint);

    const q=perguntas[indice];

    document.getElementById("questionText")
        .textContent=q[0];

    const answers=document.getElementById("answers");

    answers.innerHTML="";

    q[1].forEach((opcao,i)=>{

        const btn=document.createElement("button");

        btn.className="answer";
        btn.textContent=
            String.fromCharCode(65+i)+") "+opcao;

        btn.onclick=()=>responder(i,btn);

        answers.appendChild(btn);
    });

    document.getElementById("progress")
        .textContent=
        `Pergunta ${indice+1} de ${perguntas.length}`;

    document.getElementById("gamePrize")
        .textContent=
        formatarDinheiro(
            indice>0
            ? premios[indice-1]
            : 0
        );

    renderizarPremios();

    iniciarTimer();

    atualizarStreak();

}


function renderizarPremios(){

    const atual=indice;

    document.getElementById("prizeTable").innerHTML=
        premios.map((p,i)=>`

            <div class="${i===atual?"current":""}">
                <span>${i+1}</span>
                <span>${formatarDinheiro(p)}</span>
            </div>

        `).join("");
}


function iniciarTimer(){

    if(timer) clearInterval(timer);

    tempo=15;

    atualizarTimer();

    timer=setInterval(()=>{

        tempo--;

        atualizarTimer();

        if(tempo<=5 && tempo>0){

            som(260,.04);
        }

        if(tempo<=0){

            clearInterval(timer);

            tempoEsgotado();
        }

    },1000);
}


function atualizarTimer(){

    document.getElementById("timerText")
        .textContent=tempo+"s";

    document.getElementById("timerBar")
        .style.width=
        Math.max(0,(tempo/15)*100)+"%";
}


function responder(indiceResposta,botao){

    if(respondeu) return;

    respondeu=true;

    if(timer)
        clearInterval(timer);

    respostaAtual=indiceResposta;

    const q=perguntas[indice];

    const botoes=
        [...document.querySelectorAll(".answer")];

    botoes.forEach(b=>b.disabled=true);

    const correta=q[2];

    if(indiceResposta===correta){

        botao.classList.add("correct");

        acertos++;

        sequencia++;

        melhorSequenciaPartida=
            Math.max(
                melhorSequenciaPartida,
                sequencia
            );

        const velocidadeBonus=tempo*10;

        pontosVelocidade+=velocidadeBonus;

        premioAtual=premios[indice];

        maiorPremioPartida=
            Math.max(
                maiorPremioPartida,
                premioAtual
            );

        somAcerto();
        vibrar(35);

        if(indice===14){

            somMilhao();

            mostrarToast(
                "👑 VOCÊ CHEGOU AO MILHÃO!"
            );

        }else{

            mostrarToast(
                `🔥 Acertou! +${velocidadeBonus} bônus de velocidade`
            );
        }

    }else{

        botao.classList.add("wrong");

        sequencia=0;

        somErro();
        vibrar([80,50,80]);

        mostrarToast(
            "❌ Resposta errada!"
        );
    }

    atualizarStreak();

    document.getElementById("nextBtn")
        .classList.remove("hidden");
}


function tempoEsgotado(){

    if(respondeu) return;

    respondeu=true;
    respostaAtual=null;

    const botoes=
        [...document.querySelectorAll(".answer")];

    botoes.forEach(b=>b.disabled=true);

    /*
      CORREÇÃO:
      não mostramos a resposta correta como se ela
      tivesse sido selecionada.
    */

    sequencia=0;

    somErro();
    vibrar([100,50,100]);

    mostrarToast(
        "⏱️ Tempo esgotado! Você errou a pergunta."
    );

    document.getElementById("nextBtn")
        .classList.remove("hidden");

    atualizarStreak();
}


function proxima(){

    if(!respondeu) return;

    indice++;

    carregarPergunta();
}


function atualizarStreak(){

    const el=document.getElementById("streakText");

    if(sequencia>0){

        el.textContent=
            `🔥 ${sequencia} acerto${sequencia>1?"s":""} seguido${sequencia>1?"s":""}!`;

    }else{

        el.textContent="";
    }
}


/* =========================================================
   AJUDAS
========================================================= */

function usar5050(){

    if(usados["5050"] || respondeu) return;

    usados["5050"]=true;

    const q=perguntas[indice];

    const botoes=
        [...document.querySelectorAll(".answer")];

    const erradas=botoes
        .map((b,i)=>i)
        .filter(i=>i!==q[2]);

    embaralhar(erradas)
        .slice(0,2)
        .forEach(i=>{
            botoes[i].disabled=true;
            botoes[i].style.visibility="hidden";
        });

    document.getElementById("life5050")
        .classList.add("used");

    somClique();
}


function pular(){

    if(usados.skip || respondeu) return;

    usados.skip=true;

    if(timer)
        clearInterval(timer);

    indice++;

    if(indice>=perguntas.length){

        finalizar();

    }else{

        carregarPergunta();
    }

    mostrarToast("⏭️ Pergunta pulada!");
}


function dica(){

    if(usados.hint || respondeu) return;

    usados.hint=true;

    const q=perguntas[indice];

    const correta=q[2];

    abrirModal(`
        <h2>💡 Dica</h2>

        <p style="
            color:#cdbbd5;
            line-height:1.6;
            margin-bottom:15px;
        ">
            A resposta correta começa com:
            <strong>${String(q[1][correta]).charAt(0)}</strong>
            <br><br>
            Elimine as alternativas que claramente
            não fazem sentido.
        </p>

        <button class="primary" onclick="fecharModal()">
            Entendi
        </button>
    `);

    somClique();
}

========================================================= */

async function finalizar(){

    if(timer)
        clearInterval(timer);

    document.getElementById("gameScreen")
        .classList.add("hidden");

    document.getElementById("resultScreen")
        .classList.remove("hidden");

    const premio=maiorPremioPartida;

    let moedasGanhas=
        acertos*10+
        Math.floor(pontosVelocidade/20);

    if(premio>=1000000)
        moedasGanhas+=500;

    if(desafioDiarioAtivo)
        moedasGanhas+=50;

    if(premio>=1000000){

        document.getElementById("resultIcon")
            .textContent="👑";

        document.getElementById("resultTitle")
            .textContent="VOCÊ É O MILIONÁRIO!";

    }else if(acertos>=10){

        document.getElementById("resultIcon")
            .textContent="🏆";

        document.getElementById("resultTitle")
            .textContent="Excelente partida!";

    }else{

        document.getElementById("resultIcon")
            .textContent="🎮";

        document.getElementById("resultTitle")
            .textContent="Fim de jogo!";
    }

    document.getElementById("resultMoney")
        .textContent=formatarDinheiro(premio);

    document.getElementById("resultStats").innerHTML=`

        <div class="stat">
            <strong>${acertos}</strong>
            <span>Acertos</span>
        </div>

        <div class="stat">
            <strong>${melhorSequenciaPartida}</strong>
            <span>Melhor sequência</span>
        </div>

        <div class="stat">
            <strong>${pontosVelocidade}</strong>
            <span>Bônus de velocidade</span>
        </div>

        <div class="stat">
            <strong>+${moedasGanhas} 🪙</strong>
            <span>Moedas ganhas</span>
        </div>

    `;

    await salvarResultado(premio,moedasGanhas);

    verificarConquistas(premio);
}


async function salvarResultado(premio,moedas){

    if(!usuarioAtual) return;

    const antigoRecorde=
        Number(dadosUsuario.recorde||0);

    const novoRecorde=
        Math.max(antigoRecorde,premio);

    const maiorPremio=
        Math.max(
            Number(dadosUsuario.maiorPremio||0),
            premio
        );

    const partidas=
        Number(dadosUsuario.partidas||0)+1;

    const totalAcertos=
        Number(dadosUsuario.acertos||0)+acertos;

    const melhorSeq=
        Math.max(
            Number(dadosUsuario.sequencia||0),
            melhorSequenciaPartida
        );

    const novoSaldo=
        Number(dadosUsuario.moedas||0)+moedas;

    dadosUsuario={
        ...dadosUsuario,
        recorde:novoRecorde,
        maiorPremio,
        partidas,
        acertos:totalAcertos,
        sequencia:melhorSeq,
        moedas:novoSaldo
    };

    try{

        await db.collection("Usuarios")
            .doc(usuarioAtual.uid)
            .set({
                recorde:novoRecorde,
                maiorPremio,
                partidas,
                acertos:totalAcertos,
                sequencia:melhorSeq,
                moedas:novoSaldo,
                nome:dadosUsuario.nome||"Jogador",
                email:usuarioAtual.email
            },{merge:true});

    }catch(e){

        console.error(e);
    }
}

function verificarConquistas(){

    const desbloqueadas=
        dadosUsuario.conquistas||[];

    let mudou=false;

    conquistas.forEach(c=>{

        if(
            c.check(dadosUsuario) &&
            !desbloqueadas.includes(c.id)
        ){

            desbloqueadas.push(c.id);
            mudou=true;

            mostrarToast(
                `🏆 Conquista desbloqueada: ${c.nome}`
            );

            somMilhao();

    if(mudou){

            desbloqueadas;

        db.collection("Usuarios")
            .doc(usuarioAtual.uid)
            .set(
                {conquistas:desbloqueadas},

async function entrarPartidaOnline(){

    const codigo=
        document.getElementById("codigoEntrada")
        .value
        .trim()
        .toUpperCase();

    if(!codigo){

        mostrarToast("Digite o código.");
        return;
    }

    try{

        const snap=
            await db.collection("Partidas")
            .where("tipo","==","online")
            .where("codigo","==",codigo)
            .limit(1)
            .get();

        if(snap.empty){

            mostrarToast("Partida não encontrada.");
            return;
        }

        const doc=snap.docs[0];
        const d=doc.data();

        if(d.jogador2){

            mostrarToast(
                "Essa partida já possui dois jogadores."
            );

            return;
        }

        await doc.ref.update({

            jogador2:{
                uid:usuarioAtual.uid,
                nome:dadosUsuario.nome||"Jogador",
                avatar:dadosUsuario.avatar||"😀",
                respostas:{},
                pronto:false
            },

            status:"iniciada"

        });

        fecharModal();

        iniciarPartidaOnline(doc.id,2);

    }catch(e){

        console.error(e);

        mostrarToast(
            "Não foi possível entrar na partida."
        );
    }
}


async function desafiarJogador(uid){

    const codigo=
        Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase();

    const id=
        usuarioAtual.uid+"_"+Date.now();

    const lista=
        selecionarPerguntasUnicas(
            banco.geral,
            15
        );

    await db.collection("Partidas")
        .doc(id)
        .set({

            tipo:"online",
            codigo,
            criador:usuarioAtual.uid,
            convidado:uid,

            jogador1:{
                uid:usuarioAtual.uid,
                nome:dadosUsuario.nome||"Jogador",
                avatar:dadosUsuario.avatar||"😀",
                respostas:{}
            },

            jogador2:null,

            perguntas:lista.map(q=>({
                pergunta:q[0],
                opcoes:q[1],
                correta:q[2]
            })),

            status:"convite",

            criadoEm:
                firebase.firestore.FieldValue.serverTimestamp()
        });

    abrirModal(`

        <h2>⚔️ Desafio enviado!</h2>

        <p style="
            color:#c7b5ce;
            margin:15px 0;
        ">
            Compartilhe este código com o jogador:
        </p>

        <div style="
            text-align:center;
            font-size:35px;
            font-weight:bold;
            letter-spacing:5px;
            color:#ffd369;
            padding:15px;
            background:#100017;
            border-radius:15px;
        ">
            ${codigo}
        </div>

    `);

    ouvirPartidaOnline(id);
}


function ouvirPartidaOnline(id){

    if(onlineListener)
        onlineListener();

    onlineListener=
        db.collection("Partidas")
        .doc(id)
        .onSnapshot(doc=>{

            if(!doc.exists) return;

            const d=doc.data();

            if(
                d.jogador2 &&
                d.status==="iniciada" &&
                d.criador===usuarioAtual.uid
            ){

                fecharModal();

                iniciarPartidaOnline(
                    id,
                    1
                );
            }

        });
}


function iniciarPartidaOnline(id,jogador){

    partidaOnlineId=id;

    modoJogo="online";

    db.collection("Partidas")
        .doc(id)
        .get()
        .then(doc=>{

            const d=doc.data();

            perguntas=(d.perguntas||[]).map(q=>[
                q.pergunta,
                q.opcoes,
                q.correta
            ]);

            perguntas=
                selecionarPerguntasUnicas(
                    perguntas,
                    15
                );

            indice=0;
            acertos=0;
            premioAtual=0;
            maiorPremioPartida=0;
            sequencia=0;
            melhorSequenciaPartida=0;
            pontosVelocidade=0;

            usados={
                "5050":false,
                skip:false,
                hint:false
            };

            document.getElementById("menuScreen")
                .classList.add("hidden");

            document.getElementById("resultScreen")
                .classList.add("hidden");

            document.getElementById("gameScreen")
                .classList.remove("hidden");

            document.getElementById("gameCategory")
                .textContent="⚔️ Partida Online";

            document.getElementById("gamePlayer")
                .textContent=
                `Jogador ${jogador}`;

            carregarPergunta();

        });
}


async function responderOnline(indiceResposta){

    if(!partidaOnlineId || !usuarioAtual)
        return;

    try{

        await db.collection("Partidas")
            .doc(partidaOnlineId)
            .set({

                ["resposta_"+usuarioAtual.uid]:{
                    pergunta:indice,
                    resposta:indiceResposta,
                    tempo,
                    acertou:
                        indiceResposta===
                        perguntas[indice][2]
                }

            },{merge:true});

    }catch(e){

        console.error(e);
    }
}

/* =========================================================
   DESAFIO DIÁRIO
========================================================= */

function desafioDiario(){

    desafioDiarioAtivo=true;
    categoriaAtual="geral";
    modoJogo="diario";

    /*
      A data cria uma seleção determinística.
      Assim todos podem jogar o desafio do dia.
    */

    const hoje=new Date();

    const numero=
        hoje.getFullYear()*10000+
        (hoje.getMonth()+1)*100+
        hoje.getDate();

    const lista=banco.geral;

    const ordenada=
        [...lista].sort((a,b)=>{

            const va=
                hashString(a[0]+numero);

            const vb=
                hashString(b[0]+numero);

            return va-vb;
        });

    perguntas=
        selecionarPerguntasUnicas(
            ordenada,
            10
        );

    indice=0;
    acertos=0;
    premioAtual=0;
    maiorPremioPartida=0;
    sequencia=0;
    melhorSequenciaPartida=0;
    pontosVelocidade=0;

    usados={
        "5050":false,
        skip:false,
        hint:false
    };

    document.getElementById("menuScreen")
        .classList.add("hidden");

    document.getElementById("resultScreen")
        .classList.add("hidden");

    document.getElementById("gameScreen")
        .classList.remove("hidden");

    document.getElementById("gameCategory")
        .textContent="🗓️ Desafio Diário";

    document.getElementById("gamePlayer")
        .textContent="10 perguntas especiais";

    carregarPergunta();
}


function hashString(str){

    let hash=0;

    for(let i=0;i<str.length;i++){

        hash=
            ((hash<<5)-hash)+
            str.charCodeAt(i);

        hash|=0;
    }

    return Math.abs(hash);
}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
