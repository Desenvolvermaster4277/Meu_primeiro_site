<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Primeiro Site</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111827;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      color: #d1d5db;
      margin-bottom: 30px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🚀 Meu Primeiro Site</h1>

    <p>
      Se você está vendo esta página, significa que o site foi publicado!
    </p>

    <button onclick="mostrarMensagem()">
      Clique aqui
    </button>
  </div>

  <script>
    function mostrarMensagem() {
      alert("Funcionou! 🎉 Você acabou de publicar seu primeiro site.");
    }
  </script>

</body>
</html>
