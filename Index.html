*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#32105f 0%,#130820 38%,#07040d 100%);
    color:white;
    min-height:100vh;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

.app{
    width:100%;
    min-height:100vh;
    max-width:900px;
    margin:auto;
}

.topbar{
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    background:rgba(10,5,18,.88);
    border-bottom:1px solid rgba(255,255,255,.08);
    position:sticky;
    top:0;
    z-index:20;
    backdrop-filter:blur(15px);
}

.logo{
    font-size:21px;
    font-weight:900;
}

.logo span{
    color:#c084fc;
}

.top-actions{
    display:flex;
    gap:8px;
    align-items:center;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.12);
    background:#191024;
    color:white;
}

.content{
    padding:20px 15px 35px;
}

.card{
    background:rgba(23,13,35,.88);
    border:1px solid rgba(255,255,255,.09);
    border-radius:22px;
    padding:20px;
    box-shadow:0 15px 45px rgba(0,0,0,.28);
}

h1{
    font-size:30px;
    margin-bottom:8px;
}

h2{
    margin-bottom:12px;
}

h3{
    margin-bottom:8px;
}

.muted{
    color:#aaa2b6;
}

.btn{
    border:none;
    border-radius:15px;
    padding:14px 18px;
    color:white;
    font-weight:800;
    transition:.15s;
}

.btn:active{
    transform:scale(.97);
}

.btn-primary{
    background:linear-gradient(135deg,#8b5cf6,#6d28d9);
}

.btn-green{
    background:#20c76b;
}

.btn-red{
    background:#dc2626;
}

.btn-blue{
    background:#2563eb;
}

.btn-dark{
    background:#251832;
    border:1px solid rgba(255,255,255,.1);
}

.btn-gold{
    background:linear-gradient(135deg,#f59e0b,#d97706);
}

.full{
    width:100%;
}

input,select{
    width:100%;
    background:#120b1c;
    border:1px solid #352545;
    color:white;
    padding:14px;
    border-radius:13px;
    outline:none;
}

input:focus{
    border-color:#9b5cff;
}

.field{
    margin-bottom:12px;
}

.field label{
    display:block;
    margin-bottom:6px;
    color:#cfc5d8;
    font-size:14px;
}

.auth{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-box{
    width:100%;
    max-width:430px;
    background:rgba(22,12,34,.95);
    border:1px solid rgba(255,255,255,.1);
    border-radius:28px;
    padding:28px 20px;
    box-shadow:0 20px 70px rgba(0,0,0,.45);
}

.auth-title{
    text-align:center;
    margin-bottom:22px;
}

.auth-logo{
    font-size:36px;
    font-weight:1000;
    margin-bottom:8px;
}

.auth-logo span{
    color:#a855f7;
}

.auth-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:18px;
}

.auth-tab{
    border:none;
    padding:12px;
    border-radius:12px;
    background:#24152f;
    color:#aaa;
    font-weight:bold;
}

.auth-tab.active{
    background:#7c3aed;
    color:white;
}

.platform-hero{
    padding:25px 4px;
}

.platform-hero h1{
    font-size:34px;
}

.user-mini{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:18px;
}

.avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    object-fit:cover;
    background:#312044;
    border:2px solid #8b5cf6;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.avatar.large{
    width:90px;
    height:90px;
    font-size:40px;
}

.game-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
}

.game-card{
    position:relative;
    overflow:hidden;
    min-height:190px;
    border-radius:24px;
    padding:22px;
    background:
        linear-gradient(145deg,rgba(124,58,237,.95),rgba(25,12,42,.96));
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 15px 35px rgba(0,0,0,.3);
}

.game-card .game-icon{
    font-size:55px;
    margin-bottom:12px;
}

.game-card h2{
    font-size:25px;
}

.game-card p{
    color:#ddd;
    margin-bottom:18px;
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    background:rgba(255,255,255,.1);
    font-size:12px;
    font-weight:bold;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin:15px 0;
}

.stat{
    background:#160d22;
    border:1px solid #30203c;
    border-radius:16px;
    padding:15px;
}

.stat strong{
    display:block;
    font-size:22px;
    margin-top:4px;
}

.menu-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.menu-grid button{
    min-height:65px;
}

.question-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
    margin-bottom:15px;
}

.progress{
    height:8px;
    background:#24152f;
    border-radius:99px;
    overflow:hidden;
    margin-bottom:17px;
}

.progress-bar{
    height:100%;
    background:linear-gradient(90deg,#8b5cf6,#c084fc);
    transition:.3s;
}

.timer{
    width:58px;
    height:58px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#251533;
    border:3px solid #8b5cf6;
    font-size:21px;
    font-weight:900;
}

.question{
    font-size:22px;
    line-height:1.35;
    font-weight:900;
    margin-bottom:18px;
}

.answers{
    display:grid;
    gap:10px;
}

.answer{
    width:100%;
    text-align:left;
    padding:16px;
    border-radius:15px;
    border:1px solid #392649;
    background:#181020;
    color:white;
    font-weight:700;
    transition:.12s;
}

.answer:hover{
    border-color:#8b5cf6;
}

.answer:disabled{
    opacity:.8;
}

.answer.correct{
    background:#14532d;
    border-color:#22c55e;
}

.answer.wrong{
    background:#5f1515;
    border-color:#ef4444;
}

.answer.dim{
    opacity:.25;
}

.lifelines{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:14px;
}

.lifeline{
    background:#21132d;
    border:1px solid #3c2850;
    color:white;
    padding:12px 5px;
    border-radius:13px;
    font-size:13px;
    font-weight:bold;
}

.lifeline:disabled{
    opacity:.4;
}

.prize-box{
    text-align:center;
    padding:18px;
    border-radius:18px;
    background:linear-gradient(135deg,#29153c,#171020);
    margin-bottom:15px;
}

.prize{
    color:#fbbf24;
    font-size:27px;
    font-weight:1000;
}

.game-controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:15px;
}

.player-selector{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.player-btn{
    padding:12px 4px;
    border-radius:12px;
    border:1px solid #3c2850;
    background:#191021;
    color:white;
    font-weight:bold;
}

.player-btn.active{
    background:#7c3aed;
}

.player-status{
    padding:12px;
    border-radius:14px;
    background:#160c20;
    margin-bottom:12px;
}

.profile-head{
    display:flex;
    gap:18px;
    align-items:center;
    margin-bottom:20px;

.profile-name{
    font-size:25px;
    font-weight:900;
}

.level{
    color:#c084fc;
    font-weight:bold;
}

.photo-btn{
    margin-top:10px;
}

.achievement-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.achievement{
    padding:14px;
    background:#160c20;
    border-radius:15px;
    border:1px solid #2d2038;
}

.achievement.locked{
    opacity:.4;
}

.rank-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px;
    background:#160c20;
    border-radius:14px;
    margin-bottom:8px;
}

.rank-number{
    width:30px;
    font-weight:900;
    color:#fbbf24;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:100;
}

.modal-box{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    background:#170d22;
    border:1px solid #402b50;
    border-radius:24px;
    padding:22px;
}

.modal-buttons{
    display:grid;
    gap:9px;
    margin-top:15px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(100px);
    background:#24152f;
    border:1px solid #593b70;
    padding:13px 17px;
    border-radius:14px;
    z-index:200;
    transition:.3s;
    max-width:90%;
    text-align:center;
}

.toast.show{
    transform:translateX(-50%) translateY(0);
}

.daily{
    margin-top:15px;
    border:1px solid #4b2c68;
    background:linear-gradient(135deg,#29123e,#160b21);
}

.online-dot{
    width:9px;
    height:9px;
    background:#22c55e;
    border-radius:50%;
    display:inline-block;
    margin-right:5px;
}

@media(min-width:700px){
    .game-grid{
        grid-template-columns:1fr 1fr;
    }

    .content{
        padding:28px;
    }
}
</style>
</head>

<div id="authScreen" class="auth">
    <div class="auth-box">

        <div class="auth-title">
            <div class="auth-logo">Minha <span>Plataforma</span></div>
            <p class="muted">Sua central de jogos</p>
        </div>

        <div class="auth-tabs">
            <button id="loginTab" class="auth-tab active" onclick="mostrarLogin()">Entrar</button>
            <button id="signupTab" class="auth-tab" onclick="mostrarCadastro()">Criar conta</button>
        </div>

        <div id="loginForm">
            <div class="field">
                <label>E-mail</label>
                <input id="loginEmail" type="email" placeholder="seu@email.com">
            </div>

            <div class="field">
                <label>Senha</label>
                <input id="loginPassword" type="password" placeholder="Sua senha">
            </div>

            <button class="btn btn-primary full" onclick="login()">Entrar</button>
        </div>

        <div id="signupForm" class="hidden">

            <div class="field">
                <label>Nome de usuário</label>
                <input id="signupName" type="text" placeholder="Como você quer aparecer">
            </div>

            <div class="field">
                <label>E-mail</label>
                <input id="signupEmail" type="email" placeholder="seu@email.com">
            </div>

            <div class="field">
                <label>Senha</label>
                <input id="signupPassword" type="password" placeholder="Mínimo recomendado: 6 caracteres">
            </div>

            <button class="btn btn-primary full" onclick="cadastro()">Criar conta</button>
        </div>

    </div>
</div>

<div id="app" class="app hidden">

    <header class="topbar">

        <div class="logo">
            Minha <span>Plataforma</span>
        </div>

        <div class="top-actions">

            <button class="icon-btn" onclick="abrirPerfil()">👤</button>

            <button class="icon-btn" onclick="abrirConfig()">⚙️</button>

        </div>

    </header>

    <main id="content" class="content"></main>

</div>

<div id="modal" class="modal hidden">
    <div id="modalBox" class="modal-box"></div>
</div>

<div id="toast" class="toast"></div>

/* =========================================================
   BANCO DE MATEMÁTICA
========================================================= */

function gerarMatematica(){

    const banco=[];

    for(let i=0;i<125;i++){

        const a=i+2;
        const b=(i%15)+2;

        const tipo=i%4;

        let pergunta;
        let resposta;

        if(tipo===0){
            pergunta=`Quanto é ${a} + ${b}?`;
            resposta=String(a+b);
        }

        if(tipo===1){
            const maior=a+b;
            const menor=a;
            pergunta=`Quanto é ${maior} - ${menor}?`;
            resposta=String(maior-menor);
        }

        if(tipo===2){
            pergunta=`Quanto é ${a} × ${b}?`;
            resposta=String(a*b);
        }

        if(tipo===3){
            const resultado=a;
            const divisor=b;
            const total=resultado*divisor;
            pergunta=`Quanto é ${total} ÷ ${divisor}?`;
            resposta=String(resultado);
        }

        const alternativas=[
            resposta,
            String(Number(resposta)+1),
            String(Math.max(0,Number(resposta)-2)),
            String(Number(resposta)+5)
        ];

        banco.push([pergunta,...alternativas]);
    }

    return banco;
}

/* =========================================================

========================================================= */

function escapeHTML(text){
    if(text===undefined || text===null) return "";
    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function formatarDinheiro(valor){
    return "R$ "+Number(valor||0).toLocaleString("pt-BR");
}

function embaralhar(array){

    const copia=[...array];

    for(let i=copia.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [copia[i],copia[j]]=[copia[j],copia[i]];
    }

    return copia;
}

function mostrarToast(texto){

    const el=document.getElementById("toast");

    el.textContent=texto;
    el.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer=setTimeout(()=>{
        el.classList.remove("show");
    },2800);
}

async function login(){

    try{

        const email=document.getElementById("loginEmail").value.trim();
        const senha=document.getElementById("loginPassword").value;

        if(!email || !senha){
            mostrarToast("Preencha e-mail e senha.");
            return;
        }

        await auth.signInWithEmailAndPassword(email,senha);

    }catch(error){

        mostrarToast(traduzirErro(error));
    }
}

async function cadastro(){

    try{

        const nome=document.getElementById("signupName").value.trim();
        const email=document.getElementById("signupEmail").value.trim();
        const senha=document.getElementById("signupPassword").value;

        if(!nome || !email || !senha){
            mostrarToast("Preencha todos os campos.");
            return;
        }

        if(senha.length<6){
            mostrarToast("A senha precisa ter pelo menos 6 caracteres.");
            return;
        }

        const cred=await auth.createUserWithEmailAndPassword(email,senha);

        const dados={
            nome:nome,
            email:email,
            avatar:"",
            xp:0,
            nivel:1,
            moedas:0,
            recorde:0,
            maiorPremio:0,
            partidas:0,
            vitorias:0,
            acertos:0,
            erros:0,
            titulo:"Novato",
            criadoEm:FV.serverTimestamp()
        };

        await db.collection("Usuarios").doc(cred.user.uid).set(dados);

        mostrarToast("Conta criada!");

    }catch(error){

        mostrarToast(traduzirErro(error));
    }
}

function traduzirErro(error){

    const mapa={
        "auth/invalid-credential":"E-mail ou senha incorretos.",
        "auth/wrong-password":"Senha incorreta.",
        "auth/user-not-found":"Usuário não encontrado.",
        "auth/email-already-in-use":"Este e-mail já está cadastrado.",
        "auth/invalid-email":"E-mail inválido.",
        "auth/weak-password":"Senha muito fraca.",
        "auth/too-many-requests":"Muitas tentativas. Tente novamente depois."
    };

    return mapa[error.code] || error.message || "Ocorreu um erro.";
}

async function carregarPerfil(){

    const ref=db.collection("Usuarios").doc(usuario.uid);

    const snap=await ref.get();

    if(snap.exists){

        perfil={
            ...snap.data()
        };

    }else{

        perfil={
            nome:usuario.displayName || "Jogador",
            email:usuario.email,
            avatar:"",
            xp:0,
            nivel:1,
            moedas:0,
            recorde:0,
            maiorPremio:0,
            partidas:0,
            vitorias:0,
            acertos:0,
            erros:0,
            titulo:"Novato"
        };

        await ref.set(perfil);
    }
}

async function salvarPerfil(){

    if(!usuario || !perfil) return;

    await db.collection("Usuarios").doc(usuario.uid).set(
        perfil,
        {merge:true}
    );
}

/* =========================================================

========================================================= */

function criarPerguntas(categoria){

    let banco=bancos[categoria] || bancos.geral;

    banco=[...banco];

    banco=embaralhar(banco);

    const selecionadas=banco.slice(0,15);

    return selecionadas.map(item=>{

        const pergunta=item[0];

        const alternativas=item.slice(1);

        const respostaCorreta=alternativas[0];

        const respostas=embaralhar(alternativas);

        return {
            pergunta,
            respostas,
            correta:respostas.indexOf(respostaCorreta)
        };

    });
}

/* =========================================================
   TIMER
========================================================= */

function iniciarTimer(){

    pararTimer();

    jogo.tempo=15;

    atualizarTimer();

    jogo.timer=setInterval(()=>{

        jogo.tempo--;

        atualizarTimer();

        if(jogo.tempo<=0){

            pararTimer();

            tempoEsgotado();
        }

    },1000);
}

function atualizarTimer(){

    const timer=document.getElementById("timer");

    if(timer){

        timer.textContent=jogo.tempo;

        if(jogo.tempo<=5){

            timer.style.borderColor="#ef4444";
        }else{

            timer.style.borderColor="#8b5cf6";
        }
    }
}

function pararTimer(){

    if(jogo.timer){

        clearInterval(jogo.timer);
        jogo.timer=null;
    }
}


/* =========================================================
   RESPONDER
========================================================= */

function responder(index){

    if(jogo.respondida) return;

    jogo.respondida=true;

    pararTimer();

    const pergunta=jogo.perguntas[jogo.indice];

    const botoes=document.querySelectorAll(".answer");

    botoes.forEach(btn=>btn.disabled=true);

    const acertou=index===pergunta.correta;

    if(acertou){

        botoes[index]?.classList.add("correct");

        jogo.acertos++;

        const premio=premios[jogo.indice];

        jogo.premioAtual=premio;

        if(jogo.modo!=="solo"){

            const jogador=jogo.jogadores[jogo.jogadorAtual];

            jogador.acertos++;
            jogador.premio=premio;
        }

        ganharXP(20);

        tocarSom("correct");

        mostrarToast("✅ Resposta correta!");

    }else{

        botoes[index]?.classList.add("wrong");

        jogo.erros++;

        if(jogo.modo!=="solo"){

            jogo.jogadores[jogo.jogadorAtual].erros=
                (jogo.jogadores[jogo.jogadorAtual].erros||0)+1;
        }

        /* IMPORTANTE:
           ERRAR NÃO AUMENTA O PRÊMIO.
        */

        tocarSom("wrong");

        mostrarToast("❌ Resposta errada!");

    }

    setTimeout(()=>{

        proximaPergunta();

    },1200);
}


/* =========================================================
   TEMPO ESGOTADO
========================================================= */

function tempoEsgotado(){

    if(jogo.respondida) return;

    jogo.respondida=true;

    jogo.erros++;

    /*
       Não marca resposta correta.
       Não aumenta prêmio.
       Não revela a resposta correta.
    */

    tocarSom("wrong");

    mostrarToast("⏰ Tempo esgotado!");

    const botoes=document.querySelectorAll(".answer");

    botoes.forEach(btn=>btn.disabled=true);

    setTimeout(()=>{

        proximaPergunta();

    },1200);
}


/* =========================================================
   PRÓXIMA
========================================================= */

function proximaPergunta(){

    jogo.indice++;

    /*
       Ao carregar a próxima questão:
       qualquer destaque anterior desaparece,
       porque os botões são recriados.
    */

    if(jogo.modo!=="solo"){

        jogo.jogadorAtual++;

        if(jogo.jogadorAtual>=jogo.jogadores.length){

            jogo.jogadorAtual=0;
        }
    }

    if(jogo.indice>=15){

        finalizar();

    }else{

        renderizarJogo();
    }
}

    const botoes=[...document.querySelectorAll(".answer")];

/* =========================================================

========================================================= */

function ganharXP(valor){

    perfil.xp=(perfil.xp||0)+Number(valor||0);

    const novoNivel=Math.floor(perfil.xp/500)+1;

    if(novoNivel>(perfil.nivel||1)){

        perfil.nivel=novoNivel;

        if(novoNivel>=10){

            perfil.titulo="Mestre";

        }else if(novoNivel>=5){

            perfil.titulo="Veterano";

        }else if(novoNivel>=3){

            perfil.titulo="Experiente";

        }else{

            perfil.titulo="Novato";
        }
    }
}

/* =========================================================
   FOTO DA FOTOTECA
========================================================= */

function selecionarFoto(event){

    const arquivo=event.target.files?.[0];

    if(!arquivo) return;

    if(!arquivo.type.startsWith("image/")){

        mostrarToast("Escolha uma imagem.");
        return;
    }

    const reader=new FileReader();

    reader.onload=e=>{

        const imagem=new Image();

        imagem.onload=async()=>{

            const canvas=document.createElement("canvas");

            const tamanho=256;

            canvas.width=tamanho;
            canvas.height=tamanho;

            const ctx=canvas.getContext("2d");

            const escala=Math.max(
                tamanho/imagem.width,
                tamanho/imagem.height
            );

            const largura=imagem.width*escala;
            const altura=imagem.height*escala;

            const x=(tamanho-largura)/2;
            const y=(tamanho-altura)/2;

            ctx.drawImage(
                imagem,
                x,
                y,
                largura,
                altura
            );

            const data=canvas.toDataURL(
                "image/jpeg",
                .7
            );

            perfil.avatar=data;

            try{

                await salvarPerfil();

                mostrarToast("📷 Foto de perfil atualizada!");

                abrirPerfil();

            }catch(error){

                console.log(error);

                mostrarToast(
                    "Não foi possível salvar a foto."
                );
            }
        };

        imagem.src=e.target.result;
    };

    reader.readAsDataURL(arquivo);
}

            </button>

    `;

}

function observarSala(){

    if(unsubscribeSala){

        unsubscribeSala();
    }

    const ref=db.collection("Partidas")
        .doc("sala_"+salaAtual);

    unsubscribeSala=ref.onSnapshot(snap=>{

        if(!snap.exists) return;

        const data=snap.data();

        const jogadores=Object.values(data.jogadores||{});

        document.getElementById("salaStatus").innerHTML=`

            <h3>Jogadores</h3>

            ${jogadores.map(j=>`

                <div class="rank-row">

                    ${
                        j.avatar
                        ? `<img class="avatar" src="${j.avatar}">`
                        : `<div class="avatar">👤</div>`
                    }

                    <strong>
                        ${escapeHTML(j.nome)}
                    </strong>

                    <span style="margin-left:auto">
                        🟢
                    </span>

                </div>

            `).join("")}

            ${
                jogadores.length>=2
                ?
                `<button
                    class="btn btn-primary full"
                    onclick="iniciarOnlineJogo()"
                    style="margin-top:12px">

                    🎮 Começar
                </button>`
                :
                `<p class="muted">Esperando outro jogador...</p>`
            }

        `;

    });
}

async function iniciarOnlineJogo(){

    if(!salaAtual) return;

    const ref=db.collection("Partidas")
        .doc("sala_"+salaAtual);

    await ref.update({
        status:"jogando"
    });

    mostrarToast("Partida online iniciada!");
}

async function sairSala(){

    if(unsubscribeSala){

        unsubscribeSala();
        unsubscribeSala=null;
    }

    if(salaAtual){

        try{

            await db.collection("Partidas")
                .doc("sala_"+salaAtual)
                .update({

                    [`jogadores.${usuario.uid}`]:
                        FV.delete()

                });

        }catch(e){}
    }

    salaAtual=null;

    central();
}

function compartilharSala(){

}

/* =========================================================
   MÚSICA / ÁUDIO
========================================================= */

function criarAudio(){

    if(!audioCtx){

        const AudioContext=
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext) return;

        audioCtx=new AudioContext();
    }

    if(audioCtx.state==="suspended"){

        audioCtx.resume();
    }
}

function tocarNota(freq,duracao=.18,tipo="sine",volume=.025){

    if(!musicaLigada) return;

    criarAudio();

    if(!audioCtx) return;

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type=tipo;
    osc.frequency.value=freq;

    gain.gain.setValueAtTime(
        volume,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duracao
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
        audioCtx.currentTime+duracao
    );
}

const musicas={

    central:[
        261.63,329.63,392,329.63,
        293.66,349.23,440,349.23
    ],

    menu:[
        220,277.18,329.63,277.18,
        246.94,311.13,369.99,311.13
    ],

    game:[
        196,246.94,293.66,246.94,
        220,277.18,329.63,277.18
    ],

    final:[
        261.63,329.63,392,523.25,
        392,329.63,261.63,196
    ]

};

function iniciarMusica(track){

    if(!musicaLigada) return;

    criarAudio();

    if(!audioCtx) return;

    pararMusica();

    musicTrack=track;

    const notas=musicas[track]||musicas.central;

    let i=0;

    tocarNota(notas[0],.35,"sine",.018);

    musicTimer=setInterval(()=>{

        if(!musicaLigada) return;

        tocarNota(
            notas[i%notas.length],
            .32,
            "sine",
            .018
        );

        i++;

    },360);
}

function pararMusica(){

    if(musicTimer){

        clearInterval(musicTimer);
        musicTimer=null;
    }
}

function tocarSom(tipo){

    if(!efeitosLigados) return;

    criarAudio();

    if(!audioCtx) return;

    if(tipo==="correct"){

        tocarNota(523.25,.12,"triangle",.05);

        setTimeout(()=>{
            tocarNota(659.25,.15,"triangle",.05);
        },100);

    }

    if(tipo==="wrong"){

        tocarNota(180,.2,"sawtooth",.04);

    }

    if(tipo==="click"){

        tocarNota(500,.06,"square",.025);

    }

    if(tipo==="finish"){

        tocarNota(392,.18,"triangle",.05);

        setTimeout(()=>{
            tocarNota(523.25,.18,"triangle",.05);
        },180);

        setTimeout(()=>{
            tocarNota(659.25,.3,"triangle",.05);
        },360);

    }

    if(tipo==="million"){

        tocarNota(523.25,.2,"triangle",.06);

        setTimeout(()=>{
            tocarNota(659.25,.2,"triangle",.06);
        },180);

        setTimeout(()=>{
            tocarNota(783.99,.2,"triangle",.06);
        },360);

        setTimeout(()=>{
            tocarNota(1046.5,.5,"triangle",.07);
        },540);
    }
}
