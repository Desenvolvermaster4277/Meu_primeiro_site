<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CifraFácil 🎸</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:#fff
}

header{
background:linear-gradient(135deg,#111827,#1e3a8a);
padding:30px 20px;
text-align:center
}

header h1{
font-size:34px;
margin:0 0 8px
}

header p{
color:#cbd5e1;
margin:0
}

.container{
max-width:900px;
margin:auto;
padding:20px
}

.search{
display:flex;
gap:10px;
margin:20px 0
}

.search input{
flex:1;
padding:16px;
border-radius:12px;
border:1px solid #334155;
background:#111827;
color:white;
font-size:16px
}

button{
border:0;
border-radius:12px;
padding:14px 18px;
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer
}

button:hover{
background:#1d4ed8
}

.categories{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:20px
}

.categories button{
background:#1e293b
}

.card{
background:#111827;
border:1px solid #263244;
border-radius:15px;
padding:18px;
margin:12px 0;
cursor:pointer
}

.card:hover{
border-color:#3b82f6
}

.card h3{
margin:0 0 7px
}

.card p{
margin:0;
color:#94a3b8
}

#results{
margin-top:15px
}

.cifra{
display:none;
background:#111827;
border-radius:15px;
padding:20px;
margin-top:20px
}

.cifra h2{
margin-top:0
}

.chords{
white-space:pre-wrap;
font-family:monospace;
font-size:17px;
line-height:1.7;
color:#e2e8f0
}

.chord{
color:#60a5fa;
font-weight:bold
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px
}

.empty{
text-align:center;
padding:30px;
color:#94a3b8
}
</style>
</head>

<body>

<header>
<h1>🎸 CifraFácil</h1>
<p>Pesquise suas cifras de violão</p>
</header>

<div class="container">

<div class="search">
<input
id="search"
placeholder="Digite o nome da música ou artista..."
onkeydown="if(event.key==='Enter')pesquisar()"
>
<button onclick="pesquisar()">🔎 Buscar</button>
</div>

<div class="categories">
<button onclick="mostrarCategoria('Todas')">Todas</button>
<button onclick="mostrarCategoria('Pop')">Pop</button>
<button onclick="mostrarCategoria('Rock')">Rock</button>
<button onclick="mostrarCategoria('Sertanejo')">Sertanejo</button>
<button onclick="mostrarCategoria('MPB')">MPB</button>
</div>

<div id="results"></div>

<div id="cifra" class="cifra">

<h2 id="titulo"></h2>

<div class="controls">
<button onclick="transpor(-1)">⬇️ Tom -</button>
<button onclick="transpor(1)">⬆️ Tom +</button>
<button onclick="fechar()">✖ Fechar</button>
</div>

<div id="conteudo" class="chords"></div>

</div>

</div>

<script>

const musicas=[

{
titulo:"Exemplo de Música",
artista:"Artista Exemplo",
categoria:"Pop",
cifra:
`Tom: G

G              D
Esta é uma cifra de exemplo
Em             C
Para você testar o site

G                 D
Troque este conteúdo
Em                C
Pelas cifras que você possui`
},

{
titulo:"Outra Música",
artista:"Banda Exemplo",
categoria:"Rock",
cifra:
`Tom: C

C             G
Aqui começa a música
Am            F
Com os acordes no violão

C             G
Você pode pesquisar
Am             F
E abrir esta cifra`
},

{
titulo:"Canção Sertaneja",
artista:"Artista Sertanejo",
categoria:"Sertanejo",
cifra:
`Tom: D

D             A
Cifra de exemplo
Bm            G
Para seu violão

D             A
Você pode alterar
Bm             G
O tom da música`
},

{
titulo:"Canção MPB",
artista:"Artista MPB",
categoria:"MPB",
cifra:
`Tom: Am

Am             F
Uma canção de exemplo
C              G
Para testar o sistema

Am             F
Pesquise pelo nome
C               G
E abra a cifra`
}

];

let cifraAtual=null;
let tomAtual=0;

function pesquisar(){

const termo=
document.getElementById("search")
.value
.toLowerCase()
.trim();

const resultados=
musicas.filter(m=>
m.titulo.toLowerCase().includes(termo) ||
m.artista.toLowerCase().includes(termo)
);

mostrarResultados(resultados);
}

function mostrarResultados(lista){

const area=
document.getElementById("results");

area.innerHTML="";

if(lista.length===0){

area.innerHTML=
`<div class="empty">
🎸 Nenhuma cifra encontrada.<br><br>
Tente pesquisar outro nome.
</div>`;

return;
}

lista.forEach((musica,index)=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`
<h3>🎵 ${musica.titulo}</h3>
<p>${musica.artista} • ${musica.categoria}</p>
`;

card.onclick=()=>abrirCifra(musica);

area.appendChild(card);

});

}

function mostrarCategoria(categoria){

if(categoria==="Todas"){

mostrarResultados(musicas);
return;

}

const lista=
musicas.filter(
m=>m.categoria===categoria
);

mostrarResultados(lista);
}

function abrirCifra(musica){

cifraAtual=musica;
tomAtual=0;

document.getElementById("titulo").textContent=
"🎵 "+musica.titulo+
" — "+musica.artista;

document.getElementById("cifra").style.display="block";

renderizarCifra();

window.scrollTo({
top:document.getElementById("cifra").offsetTop-20,
behavior:"smooth"
});

}

const notas=[
"C","C#","D","D#","E","F",
"F#","G","G#","A","A#","B"
];

function transpor(direcao){

if(!cifraAtual)return;

tomAtual+=direcao;

renderizarCifra();

}

function renderizarCifra(){

let texto=cifraAtual.cifra;

const acordes=
texto.match(/\b[A-G](#|b)?(m|maj|dim|aug|sus|7|9|11|13)?\b/g);

if(acordes){

acordes.forEach(acorde=>{

const novo=transporAcorde(
acorde,
tomAtual
);

texto=texto.replace(
new RegExp("\\b"+escapeRegExp(acorde)+"\\b"),
novo
);

});

}

document.getElementById("conteudo").textContent=
texto;

}

function transporAcorde(acorde,semitons){

const match=
acorde.match(/^([A-G](#|b)?)(.*)$/);

if(!match)return acorde;

let nota=match[1];
let resto=match[3];

let indice=notas.indexOf(nota);

if(indice===-1){

if(nota==="Db")indice=1;
if(nota==="Eb")indice=3;
if(nota==="Gb")indice=6;
if(nota==="Ab")indice=8;
if(nota==="Bb")indice=10;

}

if(indice===-1)return acorde;

indice=
(indice+semitons+12)%12;

return notas[indice]+resto;

}

function escapeRegExp(text){

return text.replace(
/[.*+?^${}()|[\]\\]/g,
"\\$&"
);

}

function fechar(){

document.getElementById("cifra")
.style.display="none";

}

mostrarResultados(musicas);

</script>

</body>
</html>
